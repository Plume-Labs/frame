apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kmod-rdma-loader
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/kubernetes/base/kmod-rdma-loader
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-control
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: kmod-rdma-loader
      namespace: kube-system
  timeout: 2m
