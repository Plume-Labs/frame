apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-control-ui
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/kubernetes/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-control
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cluster-control-ui
      namespace: cluster-control
  timeout: 2m
