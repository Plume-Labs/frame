apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster-control
  namespace: flux-system
spec:
  interval: 1m
  # Replace REPLACE_GITHUB_OWNER and REPLACE_GITHUB_REPOSITORY with your GitOps repo before applying.
  # Or use: flux bootstrap github --owner=<owner> --repository=<repo> (auto-generates this file)
  url: https://github.com/REPLACE_GITHUB_OWNER/REPLACE_GITHUB_REPOSITORY
  ref:
    branch: main
  # Auth is managed by `flux bootstrap github`. If applying manually,
  # create a secret: kubectl create secret generic flux-git-auth -n flux-system
  #   --from-literal=username=<user> --from-literal=password=<PAT>
  # Then set: spec.secretRef.name: flux-git-auth
