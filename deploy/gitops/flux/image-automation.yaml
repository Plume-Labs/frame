apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: cluster-control
  namespace: flux-system
spec:
  # Edit newName to match your actual registry before committing to your GitOps repo.
  image: ghcr.io/REPLACE_WITH_YOUR_ORG/cluster-control
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: cluster-control
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cluster-control
  policy:
    semver:
      range: '>=1.0.0'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: cluster-control
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: cluster-control
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxbot@cluster.local
        name: FluxBot
      messageTemplate: |
        [ci skip] Update cluster-control to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: main
  update:
    path: ./deploy/kubernetes/overlays/production
    strategy: Setters
