apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster-infrastructure
  namespace: argocd
spec:
  description: Bare metal cluster infrastructure and monitoring
  sourceRepos:
    # Replace REPLACE_GITHUB_OWNER and REPLACE_GITHUB_REPOSITORY with your GitOps repo before applying.
    - 'https://github.com/REPLACE_GITHUB_OWNER/REPLACE_GITHUB_REPOSITORY'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
