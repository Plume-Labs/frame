apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neura
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Plume-Labs/Neura.git
    targetRevision: main
    path: k8s/helm/neura
    helm:
      valueFiles:
        - values.yaml
        - values-frame.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: neura
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
