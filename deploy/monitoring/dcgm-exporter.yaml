---
# NVIDIA DCGM Exporter — GPU telemetry: SM utilization, memory BW, NVLink, ECC errors
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app: dcgm-exporter
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: dcgm-exporter
  template:
    metadata:
      labels:
        app: dcgm-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      priorityClassName: system-node-critical
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.4-3.2.6-ubuntu22.04
          env:
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            - name: DCGM_EXPORTER_COLLECTORS
              value: /etc/dcgm-exporter/dcp-metrics-included.csv
            - name: DCGM_EXPORTER_LOG_LEVEL
              value: info
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add: [SYS_ADMIN]
          volumeMounts:
            - name: dcgm-metrics-config
              mountPath: /etc/dcgm-exporter
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: dcgm-metrics-config
          configMap:
            name: dcgm-exporter-metrics-config
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-exporter-metrics-config
  namespace: monitoring
data:
  dcp-metrics-included.csv: |
    # GPU utilization
    DCGM_FI_DEV_GPU_UTIL,          gauge, GPU utilization (in %).
    DCGM_FI_DEV_MEM_COPY_UTIL,     gauge, Memory utilization (in %).
    DCGM_FI_DEV_ENC_UTIL,          gauge, Encoder utilization (in %).
    DCGM_FI_DEV_DEC_UTIL,          gauge, Decoder utilization (in %).
    # SM clocks
    DCGM_FI_DEV_SM_CLOCK,          gauge, SM clock frequency (in MHz).
    DCGM_FI_DEV_MEM_CLOCK,         gauge, Memory clock frequency (in MHz).
    # Memory
    DCGM_FI_DEV_MEMORY_TEMP,       gauge, Memory temperature (in C).
    DCGM_FI_DEV_GPU_TEMP,          gauge, GPU temperature (in C).
    DCGM_FI_DEV_POWER_USAGE,       gauge, Power draw (in W).
    DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption (in mJ).
    DCGM_FI_DEV_PCIE_TX_THROUGHPUT, counter, PCIe TX throughput (in KB).
    DCGM_FI_DEV_PCIE_RX_THROUGHPUT, counter, PCIe RX throughput (in KB).
    # NVLink
    DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, NVLink bandwidth (in KB).
    # Memory bandwidth
    DCGM_FI_PROF_DRAM_ACTIVE,      gauge, DRAM active ratio.
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Tensor core active ratio.
    DCGM_FI_PROF_SM_ACTIVE,        gauge, SM active ratio.
    DCGM_FI_PROF_SM_OCCUPANCY,     gauge, SM occupancy ratio.
    # ECC errors
    DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, ECC single-bit volatile total.
    DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, ECC double-bit volatile total.
    DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, ECC single-bit aggregate total.
    DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, ECC double-bit aggregate total.
    # Retired pages
    DCGM_FI_DEV_RETIRED_SBE,       counter, Retired pages due to single-bit errors.
    DCGM_FI_DEV_RETIRED_DBE,       counter, Retired pages due to double-bit errors.
    # XID errors
    DCGM_FI_DEV_XID_ERRORS,        gauge, XID errors.
    # MIG
    DCGM_FI_DEV_MIG_MODE,          gauge, MIG mode (0=off, 1=on).
    DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Graphics engine active.
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app: dcgm-exporter
spec:
  selector:
    app: dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
