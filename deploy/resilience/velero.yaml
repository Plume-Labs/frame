---
# Velero — workload backup, snapshot, and restore for stateful services
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    name: velero
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero
  namespace: velero
  annotations:
    eks.amazonaws.com/role-arn: ""  # Populate for cloud deployments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero
subjects:
  - kind: ServiceAccount
    name: velero
    namespace: velero
---
# BackupStorageLocation — MinIO S3-compatible backend
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: neura-velero-backups
    prefix: cluster
  config:
    region: us-east-1        # MinIO requires a region string; ignored for local-only deployments — Frame runs single-site
    s3ForcePathStyle: "true"
    s3Url: http://minio-lb.data-fabric.svc.cluster.local:9000
  credential:
    name: velero-minio-credentials
    key: cloud
---
# VolumeSnapshotLocation — Ceph CSI snapshots
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: ceph-rbd
  namespace: velero
spec:
  provider: csi
  config:
    snapshotClass: rook-ceph-block
---
# Velero deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velero
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velero
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: velero
      priorityClassName: neura-high
      terminationGracePeriodSeconds: 3600
      containers:
        - name: velero
          image: velero/velero:v1.13.1
          command: [/velero]
          args:
            - server
            - --features=EnableCSI
            - --uploader-type=kopia
            - --default-backup-ttl=720h
            - --garbage-collection-frequency=1h
            - --backup-sync-period=1m
          ports:
            - name: metrics
              containerPort: 8085
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: VELERO_SCRATCH_DIR
              value: /scratch
            - name: VELERO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LD_LIBRARY_PATH
              value: /plugins
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /credentials/cloud
          volumeMounts:
            - name: plugins
              mountPath: /plugins
            - name: scratch
              mountPath: /scratch
            - name: credentials
              mountPath: /credentials
      initContainers:
        - name: velero-plugin-for-aws
          image: velero/velero-plugin-for-aws:v1.9.1
          volumeMounts:
            - mountPath: /target
              name: plugins
        - name: velero-plugin-for-csi
          image: velero/velero-plugin-for-csi:v0.7.1
          volumeMounts:
            - mountPath: /target
              name: plugins
      volumes:
        - name: plugins
          emptyDir: {}
        - name: scratch
          emptyDir: {}
        - name: credentials
          secret:
            secretName: velero-minio-credentials
---
# Scheduled backups — daily full backup of stateful namespaces
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-stateful-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    includedNamespaces:
      - neura-inference
      - neura-database
      - neura-training
      - argo
      - data-fabric
    includedResources: []
    snapshotVolumes: true
    storageLocation: default
    volumeSnapshotLocations:
      - ceph-rbd
    ttl: 720h
    labelSelector:
      matchLabels:
        backup: "true"
---
# Scheduled backups — hourly incremental for inference namespace (HIGH SLA)
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: hourly-inference-backup
  namespace: velero
spec:
  schedule: "0 * * * *"
  template:
    includedNamespaces:
      - neura-inference
    snapshotVolumes: true
    storageLocation: default
    volumeSnapshotLocations:
      - ceph-rbd
    ttl: 48h
