apiVersion: apps/v1
kind: Deployment
metadata:
  name: frame-release-sync
  namespace: frame-system
  labels:
    app.kubernetes.io/name: frame-release-sync
    app.kubernetes.io/part-of: frame
    app.kubernetes.io/component: release-sync
spec:
  # One pass at a time: a second replica would only repeat the same reads.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: frame-release-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frame-release-sync
        app.kubernetes.io/part-of: frame
    spec:
      serviceAccountName: frame-release-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: release-sync
          # The updater's image: it carries both binaries, this one is chosen by
          # `command`. Set the image the same way as for the updater.
          image: frame-updater:latest
          imagePullPolicy: IfNotPresent
          command: [/release-sync]
          args:
            - --namespace=$(NAMESPACE)
            - --repository=ghcr.io/plume-labs/hearthrack-release
            - --signer-repository=Plume-Labs/frame
            # 48 hours for a client site; a site that wants every release at
            # once (the project's own cluster) sets 0.
            - --maturation=48h
            - --interval=15m
            # Where there is no outbound access, mount a Sigstore trusted root
            # and name it here: nothing is then fetched at run time.
            # - --trusted-root=/etc/sigstore/trusted_root.json
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The Sigstore trust root is fetched through TUF into a cache; the
            # root filesystem is read-only, so the cache lives in /tmp.
            - name: HOME
              value: /tmp
          ports:
            - name: probe
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
