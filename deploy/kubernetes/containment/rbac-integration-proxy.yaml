---
# `monitoring` — the only namespace that keeps write verbs, and the only place
# the UI ever POSTs or DELETEs through a proxy.
#
#   create : POST /api/v2/silences        — silence an alert (frame-sdk.ts:2228)
#   delete : DELETE /api/v2/silence/{id}  — end one early   (frame-sdk.ts:2221)
#   get    : Prometheus query_range (:2085), Alertmanager alerts (:2139) and
#            silences (:2181), plus node-exporter's per-pod /metrics (:1234)
#
# The residual risk is honest and much smaller than what it replaces: POST and
# DELETE to any pod in `monitoring` (Prometheus, Alertmanager, Grafana), rather
# than to any pod in the cluster. Prometheus exposes no write API by default and
# Grafana requires its own credentials, so the reachable primitive is roughly
# "manipulate alerting" — which is what the feature is for.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-control-pod-proxy-alerting
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cluster-control-containment
rules:
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-control-pod-proxy-alerting
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cluster-control-containment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-control-pod-proxy-alerting
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
