apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-control-ui
spec:
  template:
    spec:
      containers:
        - name: ui
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      # Topology Manager — bind to single NUMA node for consistent memory access
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cluster-control
