apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cluster-control

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - ingress-patch.yaml

replicas:
  - name: cluster-control-ui
    count: 5

# Set before deploying:
#   cd deploy/kubernetes/overlays/production
#   kustomize edit set image cluster-control=<registry>/frame-ui:latest
images:
  - name: cluster-control

configMapGenerator:
  - name: cluster-control-config
    literals:
      - ENV=production
      - LOG_LEVEL=info

labels:
  - pairs:
      environment: production
