apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here — see base/kustomization.yaml. An overlay-wide
# namespace is an override, not a default: it would drag the node-tuning
# DaemonSets out of kube-system (where system-node-critical is the only place
# it is accepted) and collide the node-feature-discovery Namespace object with
# cluster-control's. Every resource names its own namespace.

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - ingress-patch.yaml

replicas:
  - name: cluster-control-ui
    count: 5

# Set before deploying:
#   cd deploy/kubernetes/overlays/production
#   kustomize edit set image cluster-control=<registry>/frame-ui:latest
#   kustomize edit set image frame-uiproxy=<registry>/frame-uiproxy:latest
images:
  - name: cluster-control
  - name: frame-uiproxy

# No configMapGenerator. The base declares cluster-control-config deliberately
# empty because the Settings screen owns its contents at runtime (see the
# development overlay's note), and nothing reads ENV or LOG_LEVEL: the pod is
# nginx serving a static bundle and takes its own env from the Deployment. The
# generator was also the reason this overlay had never rendered at all — it
# collided with the namespace override — and with that override gone it
# rendered a namespace-less `cluster-control-config-c2c6g75b49` that the Argo
# Application, which sets no destination.namespace, would drop into `default`
# or fail to sync. A dead generator is not worth either outcome.

labels:
  - pairs:
      environment: production
