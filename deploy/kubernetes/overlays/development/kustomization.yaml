apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cluster-control

bases:
  - ../../base

patchesStrategicMerge:
  - deployment-patch.yaml
  - ingress-patch.yaml

replicas:
  - name: cluster-control-ui
    count: 1

# Set before deploying:
#   cd deploy/kubernetes/overlays/development
#   kustomize edit set image cluster-control=<registry>/frame-ui:dev
images:
  - name: cluster-control

# No configMapGenerator for cluster-control-config. The base declares that name
# deliberately empty, because the Settings screen owns its contents at runtime —
# generating literals here both collided with it ("namespace transformation
# produces ID conflict", which is why this overlay had never rendered) and would
# have fought whoever last used the UI. Nothing consumes ENV/LOG_LEVEL: the pod
# is nginx serving a static bundle, and its own env comes from the deployment.

labels:
  - pairs:
      environment: development
