apiVersion: apps/v1
kind: Deployment
metadata:
  name: frame-updater
  namespace: frame-system
  labels:
    app.kubernetes.io/name: frame-updater
    app.kubernetes.io/part-of: frame
    app.kubernetes.io/component: updater
spec:
  # One is enough: leader election lets a second replica wait, never act. Two
  # would only help after the node holding the first fails.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frame-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frame-updater
        app.kubernetes.io/part-of: frame
    spec:
      serviceAccountName: frame-updater
      # A stop waits for a revert in progress (cmd/updater's 15 minute grace);
      # killing it earlier leaves a half-reverted platform for a person to sort out.
      terminationGracePeriodSeconds: 960
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: updater
          image: frame-updater:latest
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=$(NAMESPACE)
            - --leader-elect=true
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: probe
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
