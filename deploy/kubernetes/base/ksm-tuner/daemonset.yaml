apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ksm-tuner
  namespace: kube-system
  labels:
    app.kubernetes.io/name: ksm-tuner
    app.kubernetes.io/component: node-tuning
spec:
  selector:
    matchLabels:
      app: ksm-tuner
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ksm-tuner
    spec:
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      hostPID: true
      initContainers:
        - name: ksm-tune
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # ── 1. The scanner ────────────────────────────────────────────
              # merge_across_nodes=0 keeps dedup NUMA-local to reduce cross-node
              # memory penalties.
              #
              # Each write tolerates failure. The kernel rejects
              # merge_across_nodes with EBUSY once any page is merged, so this
              # DaemonSet would CrashLoop on its second run — the one after KSM
              # started working — if a single refused write aborted the script.
              tune() {
                if echo "$2" > "/sys/kernel/mm/ksm/$1" 2>/dev/null; then
                  echo "  $1=$2"
                else
                  echo "  $1: refused (currently $(cat "/sys/kernel/mm/ksm/$1" 2>/dev/null))"
                fi
              }
              echo "tuning scanner:"
              tune run 1
              tune pages_to_scan 4000
              tune sleep_millisecs 200
              tune merge_across_nodes 0

              # ── 2. The opt-in, which is the part that actually merges ─────
              # Setting run=1 on its own deduplicates nothing. KSM only scans
              # VMAs a process has marked mergeable, and no ordinary container
              # ever does that: measured on this cluster with run=1 already set,
              # pages_sharing was 0 and full_scans climbed against an empty
              # candidate set.
              #
              # The mark cannot be applied from outside — prctl acts on the
              # calling process — but it IS inherited by children. So it goes on
              # the service that owns containerd, and every container started
              # afterwards inherits it. systemd >= 254 exposes exactly this as
              # MemoryKSM=; these nodes run 259.5.
              #
              # Verified before writing this: a process that sets
              # PR_SET_MEMORY_MERGE and forks had 130636 pages merged (~510 MB
              # across two 256 MB private anonymous mappings), with the child
              # never calling prctl itself.
              #
              # Workers run k3s-agent.service, the server runs k3s.service.
              for unit in k3s-agent k3s; do
                if [ -f "/host/etc/systemd/system/${unit}.service" ] \
                  || [ -f "/host/usr/lib/systemd/system/${unit}.service" ]; then
                  mkdir -p "/host/etc/systemd/system/${unit}.service.d"
                  cat > "/host/etc/systemd/system/${unit}.service.d/10-ksm.conf" <<EOF
              # Managed by the ksm-tuner DaemonSet. Removing this file and
              # restarting the unit reverts to no cross-container page merging.
              [Service]
              MemoryKSM=yes
              EOF
                  echo "drop-in installed for ${unit}.service"
                fi
              done

              # Deliberately no daemon-reload and no restart from here. Bouncing
              # k3s restarts the kubelet that owns this very pod, and doing it on
              # every node at once would take the cluster down together. The
              # drop-in takes effect on the next restart of the unit, which is a
              # human decision taken one node at a time — and only containers
              # created after that restart inherit the flag, so existing
              # workloads have to be recreated to benefit.
              echo "KSM scanner state:"
              grep -r '' /sys/kernel/mm/ksm/ 2>/dev/null || true
          volumeMounts:
            - name: sys
              mountPath: /sys
            - name: host
              mountPath: /host
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 1m
              memory: 8Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: host
          hostPath:
            path: /
            type: Directory
