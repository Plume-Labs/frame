apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here, deliberately. Every resource below declares its own,
# and the ones added for node tuning are not in cluster-control: nvidia-mps
# and the node-tuning agent live in kube-system (system-node-critical is only
# accepted there), and node-feature-discovery brings its own namespace.
#
# A kustomization-wide `namespace:` is not a default, it is an override — it
# rewrites the namespace of every resource *including a Namespace object's own
# name*, which is why adding nfd under the old `namespace: cluster-control`
# failed outright with "namespace transformation produces ID conflict"
# (cluster-control and node-feature-discovery both becoming a Namespace named
# cluster-control). Removing it renders the pre-existing resources byte for
# byte identically, since each one already names cluster-control itself.
resources:
  - namespace.yaml
  - rbac.yaml
  - rbac-tier-bindings.yaml
  # Restart, scale and the manifest editor, bound per namespace rather than
  # cluster-wide — see the header of the file for why that shape is the control
  # and not a style choice.
  - rbac-workload-operator.yaml
  # The control that earns rbac-workload-operator.yaml back: baseline Pod
  # Security on the same namespaces its RoleBindings bind into. Whole-branch
  # review Critical 1 (2026-09-10) found the two shipped separately — this
  # file added the RoleBindings while ../pod-security stayed a standalone
  # target nothing referenced, so the default deploy path (Argo CD syncing
  # this overlay) granted `patch` on Deployments/StatefulSets with nothing
  # refusing a privileged pod.
  #
  # Referenced as the directory, not `../pod-security/namespaces.yaml`
  # directly: kustomize's default LoadRestrictionsRootOnly refuses a resource
  # entry that escapes this kustomization's own directory ("file ... is not
  # in or below ..."), and fails the whole build, not just this entry. A
  # directory carrying its own kustomization.yaml is exempt — it recurses as
  # a nested base with its own root — so this still resolves to the exact
  # same on-disk file (../pod-security/kustomization.yaml names it, and that
  # file is untouched: no move, no copy).
  #
  # ../pod-security's own two-phase apply order (warn+audit, sweep, THEN
  # enforce) does not apply once it is folded into this atomic render — the
  # labels namespaces.yaml carries are already post-sweep (see
  # docs/deployment.md, "Turning Pod Security on").
  # test/manifests/rbac_workload_operator_test.go and src/lib/workloads.test.ts
  # both read namespaces.yaml at its current path — do not move or copy it.
  - ../pod-security
  - config.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  # Node-level tuning. nfd and nvidia-mps are ordinary DaemonSets with no
  # drift problem; their only defect was that this file never referenced
  # them, so they have never been deployed by any automated path.
  #
  # node-tuning-agent supersedes the ksm-tuner DaemonSet, whose manifest is
  # removed in the same commit. Removing a manifest does not remove a running
  # object: on a cluster where ksm-tuner was deployed it keeps running, and
  # both it and the agent then write the KSM sysfs knobs, so deployment also
  # requires `kubectl delete ds -n kube-system ksm-tuner`.
  #
  # It also requires tuned on every node, if any NodeTuning sets
  # spec.tunedProfile: the agent nsenters for every host call, so tuned-adm is
  # the node's binary and cannot be shipped in the image. See the header of
  # node-tuning-agent/daemonset.yaml.
  - nfd
  - nvidia-mps.yaml
  - node-tuning-agent

# Applies to everything in this kustomization, node addons included — a
# kustomization-wide transformer has no per-resource scope, and these labels
# are also injected into DaemonSet/Deployment selectors. Two consequences
# worth knowing before deploying:
#   * nvidia-mps and nfd carry `part-of: monitoring-platform`, which is not
#     what they are. Cosmetic.
#   * a selector is immutable, so a previously hand-applied nvidia-mps
#     (`kubectl apply -f deploy/kubernetes/base/nvidia-mps.yaml`, as its own
#     header suggests) must be deleted before this renders over it.
commonLabels:
  app.kubernetes.io/name: cluster-control
  app.kubernetes.io/part-of: monitoring-platform

# Image names and tags are set per-overlay via `kustomize edit set image`.
# Run: kustomize edit set image cluster-control=<registry>/<image>:<tag>
#      kustomize edit set image frame-agent=<registry>/frame-agent:<tag>
#      kustomize edit set image frame-uiproxy=<registry>/frame-uiproxy:<tag>
#
# frame-uiproxy was missing here and from both overlays until 2026-09-08
# (whole-branch review C5), so `deployment.yaml`'s `frame-uiproxy:latest` was
# never rewritten and the kubelet went looking for it on Docker Hub. Every
# entry a container image names must be listed here or no overlay can retag
# it.
images:
  - name: cluster-control
  - name: frame-agent
  - name: frame-uiproxy
