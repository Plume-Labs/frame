apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cluster-control

resources:
  - namespace.yaml
  - rbac.yaml
  - config.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: cluster-control
  app.kubernetes.io/part-of: monitoring-platform

# Image name and tag are set per-overlay via `kustomize edit set image`.
# Run: kustomize edit set image cluster-control=<registry>/<image>:<tag>
images:
  - name: cluster-control
