apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-control-ui
  namespace: cluster-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-viewer
rules:
  # Core K8s resources
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Frame CRDs — full read + write for operator actions
  - apiGroups: [frame.plume-labs.io]
    resources:
      - framejobs
      - framejobs/status
      - framenodes
      - framenodes/status
      - schedulingpolicies
      - schedulingpolicies/status
      - frameresourcequotas
      - frameresourcequotas/status
      - talosmachineconfigs
      - talosmachineconfigs/status
      - talosupgrades
      - talosupgrades/status
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-control-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-control-viewer
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
