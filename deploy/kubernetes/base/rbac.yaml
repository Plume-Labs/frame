apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-control-ui
  namespace: cluster-control
---
# Role 1: read-only — for operators who want to grant a viewer token
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-viewer
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephblockpools, cephfilesystems]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.volcano.sh]
    resources: [queues, podgroups]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [frame.plume-labs.io]
    resources: [framejobs, framenodes, schedulingpolicies, frameresourcequotas, talosmachineconfigs, talosupgrades]
    verbs: [get, list, watch]
  # trivy-operator security posture (vulnerabilities + misconfigs) for the Security screen
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, configauditreports, rbacassessmentreports, exposedsecretreports, infraassessmentreports]
    verbs: [get, list, watch]
  # Velero backups (DR status) for the Resilience screen
  - apiGroups: [velero.io]
    resources: [backups, schedules, backupstoragelocations, restores]
    verbs: [get, list, watch]
---
# cluster-control-operator: write access to Frame CRDs + node cordon.
#
# 2026-07-29: bound directly to the UI pod's own ServiceAccount below — a
# conscious, accepted-risk decision for this private test cluster (not
# internet-facing, single trusted network). It means every action taken
# through the UI is attributed to the shared SA, not to the person who
# clicked it — no per-person audit trail. Do NOT carry this binding as-is to
# a cluster reachable outside a trusted network; replace it with per-user
# auth (OIDC login + K8s impersonation) and bind this role to real users
# instead, the same way `kubectl create clusterrolebinding <user>-operator
# --clusterrole=cluster-control-operator --user=<user@domain>` would.
#
# Role 2: operator — write on safe Frame CRDs (not Talos, not /status),
# plus core node cordon/uncordon (patch only — no node delete/create).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-operator
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  # POST-through-proxy, for the Alertmanager "silence" action (Alerts screen).
  # Same blast radius as the get above (any pod's HTTP endpoint, not just
  # Alertmanager's — pod names are dynamic so a resourceNames restriction
  # would be fragile) — consistent with the accepted-risk posture already
  # documented above, not a new trust boundary.
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [patch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephblockpools, cephfilesystems]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.volcano.sh]
    resources: [queues, podgroups]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Trigger on-demand Velero backups (Resilience screen) — not restores,
  # schedules, or backupstoragelocations: creating those is riskier/more
  # complex than just kicking off a backup.
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [get, list, watch, create]
  # No `update` (PUT) anywhere below — the SDK only ever does GET/POST/
  # PATCH/DELETE against these, never a full-object PUT.
  # framenodes/frameresourcequotas have no `delete`: NodeClient.delete() and
  # a quota-delete method both exist/could exist but nothing in the UI calls
  # them today — there's no screen listing FrameNode CRs by name to delete
  # (NodeProvisionWizard only creates), and no quota-removal action. Add the
  # verb back if/when that screen gets built instead of granting it early.
  - apiGroups: [frame.plume-labs.io]
    resources: [framejobs, schedulingpolicies]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [frame.plume-labs.io]
    resources: [framenodes, frameresourcequotas]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [frame.plume-labs.io]
    resources: [talosmachineconfigs, talosupgrades]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-control-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-control-viewer
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-control-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-control-operator
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
