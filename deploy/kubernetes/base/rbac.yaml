apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-control-ui
  namespace: cluster-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-viewer
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-control-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-control-viewer
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
