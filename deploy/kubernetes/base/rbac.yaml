apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-control-ui
  namespace: cluster-control
---
# Role 1: read-only — for operators who want to grant a viewer token
#
# 2026-08-10: every rule below is tied to a call site in `src/`. Anything that
# could not be tied to one was deleted rather than kept defensively — the
# removals are listed at the end of this block so the audit trail survives.
# `pods/proxy` moved out of here entirely; see
# `deploy/kubernetes/containment/rbac-integration-proxy.yaml`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-viewer
  # Labelled so the frame-viewer/-editor/-admin aggregated ClusterRoles
  # (rbac-tier-bindings.yaml) all pick this up via a `tier: viewer` selector,
  # giving every Frame user the core-object read surface below (nodes, pods,
  # events, deployments, Ceph, Volcano, Velero, ...) alongside their
  # per-kind Frame CRD tier. See rbac-tier-bindings.yaml for why every tier
  # selects viewer and up rather than only its own tier.
  labels:
    rbac.frame.plume-labs.io/tier: viewer
rules:
  # nodes  — frame-sdk.ts:996, :1315, :1611  (cluster.nodes, capacity, racks)
  # pods   — frame-sdk.ts:1167, :1322, :1523 and every `integrationPods()` call
  # events — frame-sdk.ts:2250  (ClusterEventsView)
  # `watch` is load-bearing, not habit: useLiveResource streams these paths
  # (coreListPath('nodes'/'pods'/'events') across 12 views).
  - apiGroups: [""]
    resources: [nodes, pods, events]
    verbs: [get, list, watch]
  # frame-sdk.ts:2275-2276 — ApplicationClient.list() reads exactly these two.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  # The Workloads tree: namespace → controller → pods — frame-sdk.ts
  # WorkloadClient.tree(), src/components/workloads/WorkloadsView.tsx.
  # `deployments` and `statefulsets` above are already granted; these are the
  # other two kinds the tree shows.
  #
  # `replicasets` is the same call site and is not optional decoration: a
  # Deployment's pods are owned by a ReplicaSet, never by the Deployment, so
  # without reading the ReplicaSet's ownerReferences the tree cannot attach a
  # pod to the Deployment that made it. The alternative — stripping the
  # pod-template hash off the ReplicaSet's name — is a guess that puts pods
  # under the wrong controller for any Deployment whose own name ends in
  # something hash-shaped.
  - apiGroups: [apps]
    resources: [daemonsets, replicasets]
    verbs: [get, list, watch]
  # Jobs in the same tree — frame-sdk.ts WorkloadClient.tree().
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  # frame-sdk.ts:1123, :1125 — ClusterStorageView / OverviewView / ResilienceView
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephblockpools]
    verbs: [get, list, watch]
  # frame-sdk.ts:1430 (queue read), :1378 (podgroups) — VolcanoPoolsView
  - apiGroups: [scheduling.volcano.sh]
    resources: [queues, podgroups]
    verbs: [get, list, watch]
  # frame-sdk.ts:1478 — LineageView
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  # frame-sdk.ts:1517 — ResilienceView
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  # frame-sdk.ts:1000, :1345 — node/pod metrics
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [frame.plume-labs.io]
    resources: [framejobs, framenodes, schedulingpolicies, frameresourcequotas, talosmachineconfigs, talosupgrades]
    verbs: [get, list, watch]
  # trivy-operator security posture for the Security screen.
  # frame-sdk.ts:1860-1861 and SecurityView.tsx:41-42 read these two kinds and
  # no others.
  - apiGroups: [aquasecurity.github.io]
    resources: [vulnerabilityreports, configauditreports]
    verbs: [get, list, watch]
  # Velero DR status for the Resilience screen — frame-sdk.ts:2016-2018.
  - apiGroups: [velero.io]
    resources: [backups, schedules, backupstoragelocations]
    verbs: [get, list, watch]
  #
  # REMOVED 2026-08-10, no call site anywhere in `src/`:
  #   core `services`, `namespaces`, `resourcequotas` — the UI reads Frame's
  #     own FrameResourceQuota CRs, never the core kind, and never enumerates
  #     Services or Namespaces.
  #   apps `daemonsets` — ApplicationClient reads Deployments and StatefulSets
  #     only; the only "DaemonSet" strings in `src/` are drain-skip logic
  #     reading pod ownerReferences (frame-sdk.ts:1074), which needs no verb.
  #   ceph.rook.io `cephfilesystems` — zero references.
  #   aquasecurity `rbacassessmentreports`, `exposedsecretreports`,
  #     `infraassessmentreports` — zero references.
  #   velero `restores` — zero references (the UI shows backups, never restores).
  #   core `pods/proxy` — relocated to namespaced Roles, see containment/.
---
# cluster-control-operator: write access to Frame CRDs + node cordon.
#
# 2026-07-29: bound directly to the UI pod's own ServiceAccount below — a
# conscious, accepted-risk decision for this private test cluster (not
# internet-facing, single trusted network). It meant every action taken
# through the UI was attributed to the shared SA, not to the person who
# clicked it — no per-person audit trail.
#
# 2026-08-10 (UI containment): the accepted risk above stopped being bounded
# when `cluster-control-ui-lan` (NodePort 30379) put this SA's credential in
# front of the whole LAN with no authentication in the path. This role was
# re-derived from the call sites rather than trimmed by eye: every rule now
# names the `src/` line that needs it, `pods/proxy` moved to namespaced Roles
# in `deploy/kubernetes/containment/rbac-integration-proxy.yaml`, and the
# cluster-wide `patch` on workloads is gone. Full rationale and the list of
# what was cut: `.superpowers/ui-containment-report.md`.
#
# Per-user auth is not future work any more (2026-09-08, per-user identity
# and tasks lot). This ClusterRole is no longer bound to the SA — that
# ClusterRoleBinding is gone, and this role stays defined but unbound until
# lot 1 confirms nothing else uses it (see the ServiceAccount block below).
# Per-request identity now comes from the `frame-viewer` / `frame-editor` /
# `frame-admin` aggregated ClusterRoles (`rbac-tier-bindings.yaml`), bound to
# the three `frame:` groups the `frame-uiproxy` sidecar impersonates a caller
# into, never to an individual person. **Do not "earn this role back" by
# binding it to a named user** the way an earlier version of this comment
# suggested (`--user=<user@domain>`) — that is exactly the pattern
# `docs/deployment.md`'s RBAC section rules out: `impersonate` on `users`
# cannot be bounded by `resourceNames` (email addresses are not enumerable),
# so a named-user binding on any tier role would be reachable by anyone the
# proxy can be made to impersonate as that string. Bind tiers to
# `frame:viewers` / `frame:operators` / `frame:admins` only.
#
# Role 2: operator — write on safe Frame CRDs (not Talos, not /status),
# plus core node cordon/uncordon (patch only — no node delete/create).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-operator
  # 2026-09-08, whole-branch review finding C3. Impersonation replaced the
  # ServiceAccount's authorization, and this role was left both unbound and
  # *unlabelled* — so `frame-editor` aggregated the viewer role and the 27
  # per-kind Frame CRD roles and nothing else. Cordon, drain, Scale, queue
  # tuning, queue open/close and on-demand Velero backups had no grant
  # anywhere in `deploy/`: every one of them 403'd, for admins too. The
  # branch's headline example was the first casualty.
  #
  # It is labelled whole rather than split into a read half (to the viewer
  # tier) and a write half. Three reasons, in order of weight:
  #   * `frame-editor` selects `tier: viewer` as well as `tier: editor`
  #     (rbac-tier-bindings.yaml), so every read rule below is already
  #     granted to anyone who holds this role through the aggregation.
  #     Duplicated rules in an aggregated ClusterRole are a union — they cost
  #     nothing and change nobody's permissions.
  #   * this role is documented directly above as still possibly bound
  #     somewhere outside this repo ("stays defined but unbound until lot 1
  #     confirms nothing else uses it"). Deleting rules from it before that
  #     confirmation is how a binding nobody remembered loses its reads.
  #   * it is not in fact a superset of cluster-control-viewer — it lacks the
  #     trivy-operator reads and velero's schedules/backupstoragelocations —
  #     so splitting it would not produce a clean "editor = viewer + these
  #     writes" either. The aggregation is what makes that true, and it
  #     already does.
  labels:
    rbac.frame.plume-labs.io/tier: editor
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events]
    verbs: [get, list, watch]
  # Cordon/uncordon (ClusterNodesView) — frame-sdk.ts:1036.
  # Kept: patching a Node changes labels, taints and unschedulability. It does
  # not mint a privileged pod, so unlike the Deployment patch below it is not a
  # path to node root.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  # Node drain (Nodes screen) — frame-sdk.ts:1082. Eviction, not pod delete: it
  # is the API that honours PodDisruptionBudgets, so a drain that would breach a
  # budget is refused by the apiserver rather than by us remembering to check.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # Pod logs (Workloads → Logs), including ?previous=true for the instance
  # that crash-looped — frame-sdk.ts WorkloadClient.logs().
  #
  # Operator, not viewer, and that is a decision rather than an oversight: a
  # log is the most likely place for a credential to be printed in plain text,
  # and reads leave no FrameTask — the recorder ignores them by design, so
  # there will be no record that anyone read one. The mitigation is this tier
  # boundary, not the audit trail. Moving it down to the viewer role is one
  # line if that judgement changes.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Delete a pod (Workloads → Delete pod) — frame-sdk.ts
  # WorkloadClient.deletePod(). Distinct from the pods/eviction grant above:
  # eviction honours PodDisruptionBudgets and is what a drain uses, while this
  # is the deliberate "restart this one pod now" a person asks for from the
  # pod's own panel. The console names the difference in the confirmation —
  # under a controller the pod comes back, on a bare pod it does not.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  # frame-sdk.ts:2275-2276 — ApplicationClient.list().
  #
  # `patch` REMOVED 2026-08-10. It is the single grant that turned the
  # unauthenticated UI into cluster-admin: patch any Deployment's pod template
  # to add `securityContext.privileged: true` and a `hostPath: /` volume and you
  # have root on the node, and no namespace on this cluster carries a
  # `pod-security.kubernetes.io/enforce` label to stop it. That mattered less
  # while reaching the UI meant already running in the cluster; the
  # `cluster-control-ui-lan` NodePort (30379) made it reachable from the LAN.
  #
  # It was NOT an unused grant — contrary to the assumption that only the
  # unbuilt update screen would need it, `ApplicationClient.restart()`
  # (frame-sdk.ts:2311-2327) uses it today, wired to the Restart button in
  # ApplicationsView.tsx:142. So this cut has a visible cost: that button now
  # returns 403. There is no way to keep it and keep the containment — RBAC
  # cannot restrict a patch to one JSON path, so "may set the restartedAt
  # annotation" and "may make the pod privileged" are the same grant.
  # `kubectl rollout restart` still works for anyone with a real kubeconfig.
  #
  # To put it back deliberately (and accept the escalation), re-add:
  #   - apiGroups: [apps]
  #     resources: [deployments, statefulsets]
  #     verbs: [patch]
  # The safe way to earn it back instead is PodSecurity `baseline` or
  # `restricted` enforced on every namespace, which blocks the privileged-pod
  # payload — see the 2026-08-09 security review, C1 fix 4.
  #
  # 2026-09-09, lot 2: the note above still stands for this ClusterRole, and
  # this is where the fix landed instead.
  #
  # Restart and scale are granted, but not here and not cluster-wide: a
  # `cluster-control-workload-operator` ClusterRole in
  # rbac-workload-operator.yaml, bound by a RoleBinding into each namespace
  # that carries `pod-security.kubernetes.io/enforce: baseline`
  # (deploy/kubernetes/pod-security/namespaces.yaml). That is the "safe way to
  # earn it back" this comment named: the privileged-pod payload is refused at
  # admission in exactly the namespaces where the patch is allowed.
  #
  # It is not labelled with a tier, so the aggregation does not pick it up. A
  # tier label there would make it cluster-wide again and would reach
  # rook-ceph, kube-system and monitoring, which are deliberately unlabelled
  # because Ceph, the node-tuning agent and node-exporter need privileged pods.
  # test/manifests/rbac_workload_operator_test.go asserts both halves.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
  # `deployments/scale` and `statefulsets/scale` REMOVED 2026-09-09, lot 2, and
  # moved to rbac-workload-operator.yaml alongside the Restart patch.
  #
  # Not because scaling is dangerous — the `/scale` subresource can only change
  # a replica count and cannot touch a pod template, which is why the two used
  # to be split. It moves because the spec requires restart and scale to behave
  # the same way from the screen: both available on application workloads, both
  # 403 on infrastructure ones. Leaving scale cluster-wide would give the
  # Workloads panel two buttons with two different reachs and no way for the UI
  # to explain which is which.
  #
  # The visible cost: scaling anything in an unlabelled namespace (rook-ceph,
  # monitoring, kube-system) now 403s where it used to work. `kubectl scale`
  # still does it for anyone with a real kubeconfig.
  # The Workloads tree — frame-sdk.ts WorkloadClient.tree(). Same call site as
  # the identical rules in cluster-control-viewer above; duplicated here for
  # the same reason the core reads are, and a duplicate rule in an aggregated
  # ClusterRole is a union that changes nobody's permissions.
  - apiGroups: [apps]
    resources: [daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephblockpools]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.volcano.sh]
    resources: [podgroups]
    verbs: [get, list, watch]
  # Share-weight tuning (Elastic Pools screen) — frame-sdk.ts:1406. No delete:
  # removing a queue orphans the PodGroups scheduled into it.
  - apiGroups: [scheduling.volcano.sh]
    resources: [queues]
    verbs: [get, list, watch, patch]
  # Queue open/close on the same screen — frame-sdk.ts:1433. Volcano has no
  # settable spec.state — the state change is a Command the queue controller
  # consumes and then deletes, so this is a create-only grant on a
  # self-cleaning resource. `get`/`list`/`watch` removed 2026-08-10: the UI
  # POSTs a Command and never reads one back (the follow-up poll at
  # frame-sdk.ts:1456 re-reads the *queue*, not the Command).
  - apiGroups: [bus.volcano.sh]
    resources: [commands]
    verbs: [create]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Trigger on-demand Velero backups (Resilience screen) — not restores,
  # schedules, or backupstoragelocations: creating those is riskier/more
  # complex than just kicking off a backup.
  - apiGroups: [velero.io]
    resources: [backups]
    verbs: [get, list, watch, create]
  # No `update` (PUT) anywhere below — the SDK only ever does GET/POST/
  # PATCH/DELETE against these, never a full-object PUT.
  # frameresourcequotas has no `delete`: nothing in the UI removes a quota,
  # only sets one. Add the verb if/when a removal action appears, rather than
  # granting it early.
  - apiGroups: [frame.plume-labs.io]
    resources: [framejobs, schedulingpolicies, framenodes]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [frame.plume-labs.io]
    resources: [frameresourcequotas]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [frame.plume-labs.io]
    resources: [talosmachineconfigs, talosupgrades]
    verbs: [get, list, watch]
  #
  # REMOVED 2026-08-10 — same audit as the viewer role above:
  #   core `services`, `namespaces`, `resourcequotas`   — no call site
  #   apps `daemonsets`                                  — no call site
  #   ceph.rook.io `cephfilesystems`                     — no call site
  #   bus.volcano.sh `commands` get/list/watch           — write-only in the UI
  #   apps `deployments`/`statefulsets` `patch`          — see the long note
  #     above; used by the Restart button, cut anyway because it is node root
  #   core `pods/proxy` get/create/delete                — relocated to
  #     namespaced Roles in `deploy/kubernetes/containment/`, cutting the
  #     blast radius from every pod in the cluster to six observability
  #     namespaces (read) and `monitoring` alone (POST/DELETE)
---
# Role 3: admin — the one thing the console does cluster-wide that an operator
# must not.
#
# New in lot 2 (2026-09-09). Until now nothing in this file carried
# `tier: admin`: the `frame-admin` aggregated ClusterRole
# (rbac-tier-bindings.yaml) selects viewer, editor and admin, and the admin
# tier was satisfied only by the twenty-seven per-kind Frame CRD roles in
# config/rbac. These are console grants on core and apps kinds, so they belong
# here beside the viewer and operator roles, not in config/rbac, which is
# controller-gen's and per-kind.
#
# It holds `pods/exec` and nothing else. The YAML editor's `update`/`patch` is
# NOT here — see the tombstone at the end of this role.
#
# Same discipline as the two roles above: every rule names its call site in
# `src/`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-admin
  labels:
    rbac.frame.plume-labs.io/tier: admin
rules:
  # An interactive shell (Workloads → Terminal) —
  # src/components/workloads/TerminalTab.tsx, over the URL built by execUrl()
  # in src/lib/exec-protocol.ts.
  #
  # `create` is the verb the apiserver authorizes for pods/exec whatever HTTP
  # method carries the request; a browser opens it as a WebSocket GET, and
  # frame-uiproxy records it as a create for the same reason.
  #
  # Admin only, per the decision that opened the lot's design. A shell is
  # every permission the container's own ServiceAccount holds, plus whatever is
  # on its filesystem, and the session is recorded but its *contents* are not:
  # keystroke recording was considered and rejected, because it would capture
  # every secret typed or displayed and make the audit trail itself a sensitive
  # store. The terminal tab says so where the person opening the session can
  # read it.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  #
  # The YAML editor's `update`/`patch` on pods, deployments, statefulsets,
  # daemonsets and jobs is deliberately NOT in this role, and this is the whole
  # reason the tier tests assert its absence.
  #
  # Cluster-wide, it is the same escalation as the Deployment patch removed on
  # 2026-08-10, through a different door: an admin writes
  # `securityContext.privileged: true` and a `hostPath: /` volume into a pod
  # template in a namespace where nothing refuses it, and holds node root. That
  # this programme earns a privileged grant with Pod Security rather than
  # accepting it is a principle, not a rule about one button, so the editor is
  # bounded exactly as restart and scale are: a namespaced ClusterRole in
  # rbac-workload-operator.yaml, bound only into the namespaces enforcing
  # `baseline`.
  #
  # `pods/exec` stays cluster-wide, because a shell creates no pod: bounding it
  # to the enforced namespaces would remove a capability without closing
  # anything. That is not a claim that it is harmless — a shell *inherits* the
  # target pod's privilege, and exec into one of the deliberately privileged
  # pods in an exempt namespace (Ceph, the node-tuning agent, the Talos
  # tooling) is root on the node. Hence admin-only, and hence every session is
  # recorded.
  #
  # Also deliberately absent: `create` and `delete` on those kinds anywhere.
  # Creating a resource from the console and deleting a controller are both out
  # of scope for this lot (the spec says so), and a verb granted before a call
  # site exists is exactly what the 2026-08-10 audit removed from this file.
---
# The pod ServiceAccount no longer holds cluster-control-viewer or
# cluster-control-operator directly (those ClusterRoleBindings are gone — the
# ClusterRoles themselves stay, unbound, until lot 1 confirms nothing else
# uses them). Per-request identity now comes from the uiproxy sidecar
# (deployment.yaml), which authenticates the caller against authd and
# impersonates them; the apiserver then evaluates the *impersonated* user's
# own RBAC (the frame-viewer/-editor/-admin aggregated roles in
# rbac-tier-bindings.yaml), not this ServiceAccount's.
#
# What the SA itself needs is only the right to *perform* that impersonation,
# plus the FrameTask CRUD the proxy uses to hand off long-running work
# (Task 3).
#
# Impersonating a user cannot be bounded by resourceNames — email
# addresses are not enumerable. The rule that keeps this safe lives in
# docs/deployment.md: no RBAC binding may ever name an individual user.
# Everything is granted to the three frame: groups below.
#
# The second guard is in the proxy, not here: `checkSubject`
# (internal/uiproxy/verifier.go) refuses to put a `system:` identity or a
# non-email into Impersonate-User at all. That used to be borrowed from
# FrameUserSpec.Email's pattern — a rule in another kind's CRD, enforced by
# a component that is not the proxy (whole-branch review, I6).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-impersonator
rules:
  - apiGroups: [""]
    resources: [users]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [groups]
    resourceNames: ["frame:admins", "frame:operators", "frame:viewers"]
    verbs: [impersonate]
  # Deliberately absent: serviceaccounts, uids, userextras.
  - apiGroups: [frame.plume-labs.io]
    resources: [frametasks]
    verbs: [create, get, list, delete]
  - apiGroups: [frame.plume-labs.io]
    resources: [frametasks/status]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-control-impersonator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-control-impersonator
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
---
# The Settings screen's own config, and nothing else. A namespaced Role rather
# than more rules on the ClusterRole above, pinned by resourceNames to the one
# ConfigMap: read access to every ConfigMap in the cluster would hand the UI
# other components' configuration for no reason.
#
# No `create` — resourceNames cannot restrict it (the name is not known until
# the object exists), so granting it would mean create on every ConfigMap in
# the namespace. The resource is shipped by the kustomize base instead, and
# `list` is likewise unnecessary since the UI only ever gets it by name.
#
# Split in two, and subjected to the `frame:` groups rather than to the
# ServiceAccount (whole-branch review, C3). Two separate defects were in the
# single binding this replaces:
#   * it named `ServiceAccount cluster-control-ui`, which stopped being the
#     identity making the request the moment the proxy started impersonating.
#     `loadConfig()` and the Settings screen 403'd for every user and the
#     console ran permanently on DEFAULT_CONFIG — silently, because
#     loadConfig is deliberately fail-open.
#   * `get` and `patch` were one grant. Reading the config is something every
#     screen does on boot; writing it is an action, and actions stop at the
#     editor tier like every other write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-control-config
  namespace: cluster-control
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-control-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-control-config
  namespace: cluster-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-control-config
subjects:
  - kind: Group
    name: "frame:viewers"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "frame:operators"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "frame:admins"
    apiGroup: rbac.authorization.k8s.io
---
# Saving from the Settings screen. Operators and admins only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-control-config-write
  namespace: cluster-control
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cluster-control-config]
