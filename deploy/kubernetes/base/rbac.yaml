apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-control-ui
  namespace: cluster-control
---
# Role 1: read-only — for operators who want to grant a viewer token
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-viewer
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephblockpools, cephfilesystems]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.volcano.sh]
    resources: [queues, podgroups]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [frame.plume-labs.io]
    resources: [framejobs, framenodes, schedulingpolicies, frameresourcequotas, talosmachineconfigs, talosupgrades]
    verbs: [get, list, watch]
---
# cluster-control-operator: bind to human operator accounts who need write access to Frame CRDs.
# Example: kubectl create clusterrolebinding <user>-operator \
#   --clusterrole=cluster-control-operator --user=<user@domain>
# The UI pod's SA is bound to cluster-control-viewer (read-only) — not this role.
#
# Role 2: operator — write on safe Frame CRDs only (not Talos, not /status)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-control-operator
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, namespaces, resourcequotas, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/proxy]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [ceph.rook.io]
    resources: [cephclusters, cephblockpools, cephfilesystems]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.volcano.sh]
    resources: [queues, podgroups]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [frame.plume-labs.io]
    resources: [framejobs, schedulingpolicies, frameresourcequotas]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [frame.plume-labs.io]
    resources: [framenodes, talosmachineconfigs, talosupgrades]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-control-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-control-viewer
subjects:
  - kind: ServiceAccount
    name: cluster-control-ui
    namespace: cluster-control
