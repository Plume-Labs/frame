    name: "frame:operators"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "frame:admins"
    apiGroup: rbac.authorization.k8s.io
# The editor's bindings. `frame:admins` only — the tier split the two roles
# exist to preserve. An operator restarts and scales here; an admin also
