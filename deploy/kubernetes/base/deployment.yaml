apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-control-ui
  namespace: cluster-control
  labels:
    app: cluster-control
    component: ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster-control
      component: ui
  template:
    metadata:
      labels:
        app: cluster-control
        component: ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: cluster-control-ui
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cluster-control
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: inject-token
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/sa/token)
              echo "window.__FRAME_TOKEN__='${TOKEN}';" > /config/config.js
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/sa
            - name: config-js
              mountPath: /config
      containers:
        - name: ui
          image: cluster-control:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: config-js
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: kubernetes
        - name: config-js
          emptyDir: {}
