apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-control-ui
  namespace: cluster-control
  labels:
    app: cluster-control
    component: ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster-control
      component: ui
  template:
    metadata:
      labels:
        app: cluster-control
        component: ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: cluster-control-ui
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cluster-control
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ui
          image: cluster-control:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
        # Authenticating reverse-proxy to the Kubernetes API. kubectl proxy uses
        # the pod ServiceAccount (cluster-control-viewer, read-only) and listens
        # on localhost only; nginx forwards /api and /apis to it.
        - name: kube-proxy-api
          image: rancher/kubectl:v1.36.2
          args:
            - proxy
            - --port=8001
            - --address=127.0.0.1
            - --accept-hosts=^.*$
          ports:
            - name: kube-api
              containerPort: 8001
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # No readiness probe: kubectl proxy binds loopback only, so the kubelet
          # (which probes the pod IP) cannot reach it. nginx is the readiness gate.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
