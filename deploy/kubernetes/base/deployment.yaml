apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-control-ui
  namespace: cluster-control
  labels:
    app: cluster-control
    component: ui
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster-control
      component: ui
  template:
    metadata:
      labels:
        app: cluster-control
        component: ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: cluster-control-ui
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - cluster-control
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ui
          image: cluster-control:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            # nginx's `location /auth/` proxies to authd over TLS and verifies
            # its certificate, which the in-cluster `frame-auth-ca` Issuer
            # signs — no public root chains to it. Projected from the leaf
            # Secret with `items`, so only `ca.crt` lands in the container and
            # authd's serving private key never does.
            - name: frame-auth-ca
              mountPath: /etc/frame-auth-ca
              readOnly: true
        # Authenticates the UI's requests against authd and impersonates the
        # person they name. Replaces `kubectl proxy`, which authenticated
        # every request — reads and writes alike — as the pod ServiceAccount.
        - name: uiproxy
          image: frame-uiproxy:latest
          env:
            - name: JWKS_URL
              value: https://cluster-control-auth.cluster-control.svc/keys
            # authd's serving certificate is issued by the in-cluster
            # `frame-auth-ca` Issuer and this image is distroless/static, so
            # the system pool cannot verify it: without this the JWKS fetch
            # fails `x509: certificate signed by unknown authority` and the
            # proxy 401s every request in the cluster. The variable is
            # required — the container refuses to start without it rather
            # than refusing everyone.
            - name: JWKS_CA_FILE
              value: /etc/frame-auth-ca/ca.crt
            - name: OIDC_ISSUER_URL
              value: https://cluster-control-auth.cluster-control.svc
            - name: OIDC_CLIENT_ID
              value: frame-ui
            - name: TASK_NAMESPACE
              value: frame-system
          ports:
            - name: kube-api
              containerPort: 8001
              protocol: TCP
          resources:
            requests: {memory: "32Mi", cpu: "10m"}
            limits: {memory: "128Mi", cpu: "200m"}
          # No readiness probe: it binds loopback only, so the kubelet cannot
          # reach it. nginx is the readiness gate.
          volumeMounts:
            # Same projection as the ui container above: only `ca.crt`, never
            # authd's serving private key.
            - name: frame-auth-ca
              mountPath: /etc/frame-auth-ca
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        # Created by cert-manager from deploy/kubernetes/authd/certificate.yaml,
        # which is a separate kustomization applied first (Stage 1). `ca.crt`
        # is the frame-auth-ca certificate cert-manager copies into every leaf
        # Secret it issues from that CA Issuer.
        - name: frame-auth-ca
          secret:
            secretName: frame-auth-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
