apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-control-auth
  namespace: cluster-control
  labels:
    app: cluster-control
    component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cluster-control
      component: auth
  template:
    metadata:
      labels:
        app: cluster-control
        component: auth
    spec:
      serviceAccountName: cluster-control-auth
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - auth
                topologyKey: kubernetes.io/hostname
      containers:
        - name: authd
          image: cluster-control-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            # WebAuthn now targets the UI's real hostname (lot 0, task 6):
            # RP_ID/RP_ORIGIN must match wherever the browser is actually
            # talking to cluster-control-ui, or WebAuthn's origin check
            # rejects every login. OIDC_ISSUER_URL/OIDC_CLIENT_ID stay as-is
            # here: they match what the uiproxy sidecar validates
            # (deploy/kubernetes/base/deployment.yaml), the in-cluster
            # Service DNS name and the `frame-ui` client id, both unchanged
            # since Stage 1.
            #
            # TODO: `frame.anna.ovh` is a placeholder pending confirmation —
            # nothing in this repo names the real hostname (base/ingress.yaml
            # and both overlays use REPLACE_HOSTNAME / REPLACE_YOUR_DOMAIN).
            # Confirm and correct before this is actually deployed.
            - name: OIDC_ISSUER_URL
              value: https://cluster-control-auth.cluster-control.svc
            - name: OIDC_CLIENT_ID
              value: frame-ui
            - name: RP_ID
              value: frame.anna.ovh
            - name: RP_ORIGIN
              value: https://frame.anna.ovh
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TOKEN_TTL
              value: 15m
            - name: KEYS_DIR
              value: /etc/frame-auth-keys
            - name: TLS_CERT_FILE
              value: /etc/frame-auth-tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/frame-auth-tls/tls.key
            - name: BOOTSTRAP_SECRET_NAME
              value: frame-auth-bootstrap
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls
              mountPath: /etc/frame-auth-tls
              readOnly: true
            - name: keys
              mountPath: /etc/frame-auth-keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: frame-auth-tls
        - name: keys
          secret:
            secretName: frame-auth-keys
        - name: tmp
          emptyDir: {}
