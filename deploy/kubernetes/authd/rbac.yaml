apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-control-auth
  namespace: cluster-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-control-auth
  namespace: cluster-control
rules:
  # Read accounts to authenticate; write status to record credentials and
  # rotate sign counters. Create backs two routes now: /auth/bootstrap (the
  # first admin) and /auth/invite (an operator or viewer, holding no
  # credential). What stops this SA itself minting a second admin is not
  # this Role at all — it is authd's own AdminCount() > 0 check
  # (handleBootstrap in internal/authd/server_bootstrap.go), which closes
  # /auth/bootstrap the instant the first admin exists, and handleInvite's
  # own refusal of any role but operator/viewer (internal/authd/server_invite.go)
  # before a create is ever attempted. The admission webhook
  # (requireAdminRequester, internal/webhook/frame/v1beta1/frameuser_webhook.go)
  # is the backstop for anyone else who ends up holding `create` on
  # frameusers — e.g. frameuser-editor-role bound by hand, or this SA if
  # either of its own guards were ever removed — refusing a create carrying
  # `spec.role: admin` from anyone who is not already an admin, once any
  # admin exists.
  - apiGroups: [frame.plume-labs.io]
    resources: [frameusers]
    verbs: [get, list, watch, create]
  - apiGroups: [frame.plume-labs.io]
    resources: [frameusers/status]
    verbs: [get, patch, update]
  # Get to load the bootstrap token, delete it once it is consumed.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [frame-auth-bootstrap]
    verbs: [get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-control-auth
  namespace: cluster-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-control-auth
subjects:
  - kind: ServiceAccount
    name: cluster-control-auth
    namespace: cluster-control
