---
- name: Configure PXE Boot Server
  hosts: pxe_server_group
  become: true
  
  tasks:
    - name: Install PXE dependencies
      apt:
        name:
          - dnsmasq
          - tftp-hpa
          - nfs-kernel-server
          - syslinux
          - pxelinux
        state: present
        
    - name: Create TFTP directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /var/lib/tftpboot
        - /var/lib/tftpboot/pxelinux.cfg
        - /var/lib/tftpboot/images
        - /var/lib/tftpboot/images/ubuntu-22.04
        
    - name: Copy PXE boot files
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: /usr/lib/PXELINUX/pxelinux.0, dest: /var/lib/tftpboot/ }
        - { src: /usr/lib/syslinux/modules/bios/ldlinux.c32, dest: /var/lib/tftpboot/ }
        - { src: /usr/lib/syslinux/modules/bios/menu.c32, dest: /var/lib/tftpboot/ }
        
    - name: Configure dnsmasq for PXE
      template:
        src: ../templates/dnsmasq-pxe.conf.j2
        dest: /etc/dnsmasq.d/pxe.conf
        mode: '0644'
      notify: restart dnsmasq
      
    - name: Create PXE boot menu
      template:
        src: ../templates/pxe-menu.j2
        dest: /var/lib/tftpboot/pxelinux.cfg/default
        mode: '0644'
        
    - name: Download Ubuntu netboot image
      get_url:
        url: https://releases.ubuntu.com/22.04/ubuntu-22.04-netboot-amd64.tar.gz
        dest: /tmp/ubuntu-netboot.tar.gz
        
    - name: Extract netboot image
      unarchive:
        src: /tmp/ubuntu-netboot.tar.gz
        dest: /var/lib/tftpboot/images/ubuntu-22.04/
        remote_src: yes
        
    - name: Configure NFS exports for installation
      lineinfile:
        path: /etc/exports
        line: "/var/lib/tftpboot {{ pxe_network }}/24(ro,sync,no_subtree_check)"
        create: yes
      notify: restart nfs-server
      
  handlers:
    - name: restart dnsmasq
      service:
        name: dnsmasq
        state: restarted
        
    - name: restart nfs-server
      service:
        name: nfs-kernel-server
        state: restarted
