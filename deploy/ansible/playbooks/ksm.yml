---
# KSM — Kernel Same-Page Merging
# Merges identical in-memory pages across processes loading the same model
# weights (Ollama, vLLM). Saves several GB of RAM per node at ~1% CPU cost.
#
# Run: ansible-playbook -i inventory/hosts.ini ksm.yml
#
# Tags:
#   enable   — enable KSM and set scan parameters
#   disable  — disable KSM
#   status   — show current KSM stats

- name: KSM — Kernel Same-Page Merging
  hosts: workers
  become: true
  gather_facts: false

  vars:
    ksm_enabled: true            # set false to disable
    pages_to_scan: 4000          # pages per scan cycle (higher = more CPU)
    sleep_millisecs: 200         # ms between scan cycles (lower = faster merge)
    merge_across_nodes: 0        # 0 = only merge within same NUMA node (safer)

  tasks:

    # ── Enable ────────────────────────────────────────────────────────────────
    - name: Enable KSM
      shell: echo 1 > /sys/kernel/mm/ksm/run
      when: ksm_enabled
      changed_when: true
      tags: [enable]

    - name: Set pages_to_scan
      shell: echo {{ pages_to_scan }} > /sys/kernel/mm/ksm/pages_to_scan
      when: ksm_enabled
      changed_when: true
      tags: [enable]

    - name: Set scan interval (sleep_millisecs)
      shell: echo {{ sleep_millisecs }} > /sys/kernel/mm/ksm/sleep_millisecs
      when: ksm_enabled
      changed_when: true
      tags: [enable]

    - name: Restrict merging to same NUMA node (safer for latency)
      shell: echo {{ merge_across_nodes }} > /sys/kernel/mm/ksm/merge_across_nodes
      when: ksm_enabled
      changed_when: true
      tags: [enable]

    - name: Persist KSM settings across reboots (sysctl)
      copy:
        dest: /etc/sysctl.d/99-ksm.conf
        content: |
          # KSM — enabled for Ollama/vLLM model-weight de-duplication
          # Note: run/pages_to_scan/sleep_millisecs are not sysctl keys;
          # they are written via /etc/rc.local or a systemd service below.
      when: ksm_enabled
      tags: [enable]

    - name: Install KSM startup systemd unit
      copy:
        dest: /etc/systemd/system/ksm-tune.service
        content: |
          [Unit]
          Description=KSM tuning for Frame cluster
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c '\
            echo 1 > /sys/kernel/mm/ksm/run && \
            echo {{ pages_to_scan }} > /sys/kernel/mm/ksm/pages_to_scan && \
            echo {{ sleep_millisecs }} > /sys/kernel/mm/ksm/sleep_millisecs && \
            echo {{ merge_across_nodes }} > /sys/kernel/mm/ksm/merge_across_nodes'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      notify: reload systemd and enable ksm-tune
      when: ksm_enabled
      tags: [enable]

    # ── Disable ───────────────────────────────────────────────────────────────
    - name: Disable KSM
      shell: echo 0 > /sys/kernel/mm/ksm/run
      when: not ksm_enabled
      changed_when: true
      tags: [disable]

    - name: Disable KSM startup unit
      systemd:
        name: ksm-tune
        enabled: false
        state: stopped
      when: not ksm_enabled
      ignore_errors: true
      tags: [disable]

    # ── Status ────────────────────────────────────────────────────────────────
    - name: Read KSM stats
      shell: |
        echo "=== KSM status on {{ inventory_hostname }} ==="
        for f in run pages_merged pages_sharing pages_unshared \
                 pages_to_scan sleep_millisecs full_scans; do
          val=$(cat /sys/kernel/mm/ksm/$f 2>/dev/null || echo N/A)
          printf "%-35s %s\n" "$f:" "$val"
        done
        saved_mb=$(( $(cat /sys/kernel/mm/ksm/pages_merged 2>/dev/null || echo 0) * 4 / 1024 ))
        echo "memory_saved_mb:                    $saved_mb"
      register: ksm_stats
      changed_when: false
      tags: [status]

    - name: Print KSM stats
      debug:
        msg: "{{ ksm_stats.stdout_lines }}"
      tags: [status]

  handlers:
    - name: reload systemd and enable ksm-tune
      shell: systemctl daemon-reload && systemctl enable --now ksm-tune
      args:
        executable: /bin/bash
