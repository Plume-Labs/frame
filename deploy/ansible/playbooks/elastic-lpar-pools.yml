---
# Elastic LPAR Pools — Ansible Playbook for Frame
#
# Manages Volcano Queue resource bounds at runtime without cluster restarts.
# This enables "mainframe LPAR" style elastic partitioning of the GPU cluster.
#
# Usage:
#   # Initial provisioning
#   ansible-playbook -i inventory/hosts.ini elastic-lpar-pools.yml -e action=apply
#
#   # Expand a pool's CPU cap at runtime
#   ansible-playbook -i inventory/hosts.ini elastic-lpar-pools.yml \
#     -e action=expand -e pool_name=lpar-training-low -e new_cpu_max=640 \
#     -e new_memory_max_gi=1280 -e new_gpu_max=80
#
#   # Contract a pool (reclaim headroom)
#   ansible-playbook -i inventory/hosts.ini elastic-lpar-pools.yml \
#     -e action=contract -e pool_name=lpar-batch-medium -e new_cpu_max=64 \
#     -e new_memory_max_gi=128 -e new_gpu_max=8
#
#   # Drain a pool before decommission
#   ansible-playbook -i inventory/hosts.ini elastic-lpar-pools.yml \
#     -e action=drain -e pool_name=lpar-eval

- name: Elastic LPAR Pools — Frame
  hosts: control_plane[0]
  become: false
  gather_facts: false

  vars:
    action: apply                   # apply | expand | contract | drain | status
    pool_name: ""                   # required for expand / contract / drain
    new_cpu_max: ""                 # cores (string)
    new_memory_max_gi: ""           # Gi (numeric)
    new_gpu_max: ""                 # GPU count (string)
    manifest_path: "{{ playbook_dir }}/../../../deploy/kubernetes/scheduling/elastic-lpar-pools.yaml"

  tasks:

    # ── Apply: initial provisioning ───────────────────────────────────────────
    - name: Apply Elastic LPAR Pool manifests (Volcano Queues + ResourceQuotas)
      command: kubectl apply -f {{ manifest_path }}
      when: action == 'apply'
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"

    - name: Show apply output
      debug:
        msg: "{{ apply_result.stdout_lines }}"
      when: action == 'apply'

    # ── Status: show all LPAR pool queues ────────────────────────────────────
    - name: Show LPAR pool queue status
      command: >
        kubectl get queue -l frame.plume-labs.io/pool-type=elastic-lpar
        -o custom-columns=NAME:.metadata.name,STATE:.status.state,ALLOCATED_CPU:.status.allocated.cpu,ALLOCATED_MEM:.status.allocated.memory,ALLOCATED_GPU:.status.allocated['nvidia.com/gpu']
      register: queue_status
      changed_when: false
      when: action == 'status'

    - name: Print queue status
      debug:
        msg: "{{ queue_status.stdout_lines }}"
      when: action == 'status'

    # ── Validate pool_name is provided for mutating actions ──────────────────
    - name: Assert pool_name is set
      assert:
        that: pool_name | length > 0
        fail_msg: "pool_name must be set for action={{ action }}"
      when: action in ['expand', 'contract', 'drain']

    # ── Expand: raise the Queue capability ceiling ────────────────────────────
    - name: Expand pool CPU cap
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"capability":{"cpu":"{{ new_cpu_max }}"}}}'
      when: action == 'expand' and new_cpu_max | length > 0
      register: expand_cpu
      changed_when: expand_cpu.rc == 0

    - name: Expand pool memory cap
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"capability":{"memory":"{{ new_memory_max_gi }}Gi"}}}'
      when: action == 'expand' and new_memory_max_gi | length > 0
      register: expand_mem
      changed_when: expand_mem.rc == 0

    - name: Expand pool GPU cap
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"capability":{"nvidia.com/gpu":"{{ new_gpu_max }}"}}}'
      when: action == 'expand' and new_gpu_max | length > 0
      register: expand_gpu
      changed_when: expand_gpu.rc == 0

    # ── Contract: lower the Queue capability ceiling ──────────────────────────
    - name: Contract pool CPU cap
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"capability":{"cpu":"{{ new_cpu_max }}"}}}'
      when: action == 'contract' and new_cpu_max | length > 0
      register: contract_cpu
      changed_when: contract_cpu.rc == 0

    - name: Contract pool memory cap
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"capability":{"memory":"{{ new_memory_max_gi }}Gi"}}}'
      when: action == 'contract' and new_memory_max_gi | length > 0
      register: contract_mem
      changed_when: contract_mem.rc == 0

    - name: Contract pool GPU cap
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"capability":{"nvidia.com/gpu":"{{ new_gpu_max }}"}}}'
      when: action == 'contract' and new_gpu_max | length > 0
      register: contract_gpu
      changed_when: contract_gpu.rc == 0

    # ── Drain: mark queue as closed so no new jobs are admitted ──────────────
    - name: Close queue to drain pool
      command: >
        kubectl patch queue {{ pool_name }}
        --type=merge
        -p '{"spec":{"state":"Closed"}}'
      when: action == 'drain'
      register: drain_result
      changed_when: drain_result.rc == 0

    - name: Wait for all pods in queue to complete
      shell: |
        pending=$(kubectl get podgroup -A -l volcano.sh/queue-name={{ pool_name }} \
          --field-selector=status.phase!=Completed,status.phase!=Failed \
          --no-headers 2>/dev/null | wc -l)
        echo "$pending"
      register: pending_pods
      until: pending_pods.stdout | trim == "0"
      retries: 60
      delay: 10
      when: action == 'drain'

    - name: Confirm drain complete
      debug:
        msg: "Pool {{ pool_name }} drained — all PodGroups completed."
      when: action == 'drain'
