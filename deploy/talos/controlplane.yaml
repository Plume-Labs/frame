# Talos MachineConfig base for Frame control plane nodes.
# This file is intended as a starting point and can be patched per environment.
machine:
  # Control plane node role (runs etcd and Kubernetes control-plane services).
  type: controlplane
  # Baseline kernel sysctls for control-plane stability.
  sysctls:
    net.core.somaxconn: "4096"
    net.ipv4.tcp_max_syn_backlog: "8192"
    vm.max_map_count: "262144"
  kubelet:
    # Extra kubelet arguments for control-plane nodes.
    extraArgs:
      rotate-server-certificates: "true"
      event-qps: "0"
      pod-max-pids: "4096"
cluster:
  # CNI is managed by Flux GitOps in this repository.
  network:
    cni:
      name: none
