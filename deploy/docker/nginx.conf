server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes every filename under /assets/, so a given URL's bytes never
    # change — cache it forever instead of paying a revalidation round-trip per
    # chunk (there are ~50) on each load. index.html must NOT get this: it is
    # the one unhashed file, and caching it would pin the browser to an old
    # bundle across deploys.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Self-hosted fonts. Unhashed names, so no `immutable` — a month, long
    # enough to stay out of the way, short enough that replacing a file
    # actually reaches clients.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy the Kubernetes API to the in-pod `frame-uiproxy` sidecar, which
    # replaced the old unauthenticated `kubectl proxy`. It validates the
    # bearer token the browser holds (issued by authd, 15-minute TTL — an
    # apiserver would not accept it directly), strips any Impersonate-*
    # headers the browser sent, and re-issues the request impersonating the
    # person the token names plus their `frame:` group. The pod
    # ServiceAccount itself carries only the right to perform that
    # impersonation (see rbac.yaml, cluster-control-impersonator) — it no
    # longer holds the write actions (job cancel, policy apply/delete, quota
    # edit, node cordon) directly; the apiserver evaluates the impersonated
    # identity's own RBAC for those.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /apis/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # authd. Without this block every `/auth/*` call the UI makes falls
    # through `location /` to `try_files ... /index.html` and comes back 200
    # with the console's own HTML — `res.ok` is true, `res.json()` throws
    # `Unexpected token '<'`, and nobody can sign in. That was finding C1 of
    # the whole-branch review; `AuthUnreachableError` in `src/lib/auth.ts` is
    # the client-side half that names this misconfiguration if it ever comes
    # back.
    #
    # authd terminates TLS itself (`TLS_CERT_FILE`, container port 8443,
    # Service port 443) with a certificate issued by the in-cluster
    # `frame-auth-ca` Issuer, which no public root chains to — hence
    # `proxy_ssl_trusted_certificate` and the `frame-auth-ca` volume in
    # `deploy/kubernetes/base/deployment.yaml`. `proxy_ssl_verify on` is
    # deliberate: turning it off would make the CA mount pointless and leave
    # session cookies and passwords on an unauthenticated hop.
    #
    # The Service DNS name is resolved once, when nginx loads its config —
    # that is what a literal (non-variable) host in `proxy_pass` does. For a
    # ClusterIP that never changes it is the right trade: the pod refuses to
    # start if authd's Service is missing, rather than serving a console
    # nobody can log into.
    location /auth/ {
        proxy_pass https://cluster-control-auth.cluster-control.svc:443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/frame-auth-ca/ca.crt;
        # SNI must be the name the certificate is issued for, not $host: the
        # browser reaches this pod by the ingress hostname, and authd's cert
        # names only its Service DNS names.
        proxy_ssl_server_name on;
        proxy_ssl_name cluster-control-auth.cluster-control.svc;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    gzip on;
    gzip_vary on;
    # `application/javascript` is the type nginx actually labels .js with; the
    # two legacy spellings below matched nothing, so the main bundle shipped
    # uncompressed at 549 KB instead of 167 KB while the CSS (matching
    # text/css) compressed fine. Keep the legacy names for anything that still
    # sends them. woff2 is already compressed — deliberately not listed.
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json;
    gzip_min_length 1024;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
