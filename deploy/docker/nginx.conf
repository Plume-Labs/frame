server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the Kubernetes API to the in-pod `kubectl proxy` sidecar, which
    # authenticates with the pod ServiceAccount. That SA is bound to both
    # cluster-control-viewer AND cluster-control-operator (see rbac.yaml for
    # why — accepted-risk decision for this trusted test cluster), so this
    # path also carries the write actions (job cancel, policy apply/delete,
    # quota edit, node cordon). The browser never sees a token.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /apis/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
