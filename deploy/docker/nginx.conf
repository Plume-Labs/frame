server {
    listen 8080;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes every filename under /assets/, so a given URL's bytes never
    # change — cache it forever instead of paying a revalidation round-trip per
    # chunk (there are ~50) on each load. index.html must NOT get this: it is
    # the one unhashed file, and caching it would pin the browser to an old
    # bundle across deploys.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Self-hosted fonts. Unhashed names, so no `immutable` — a month, long
    # enough to stay out of the way, short enough that replacing a file
    # actually reaches clients.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Proxy the Kubernetes API to the in-pod `kubectl proxy` sidecar, which
    # authenticates with the pod ServiceAccount. That SA is bound to both
    # cluster-control-viewer AND cluster-control-operator (see rbac.yaml for
    # why — accepted-risk decision for this trusted test cluster), so this
    # path also carries the write actions (job cancel, policy apply/delete,
    # quota edit, node cordon). The browser never sees a token.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /apis/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    gzip on;
    gzip_vary on;
    # `application/javascript` is the type nginx actually labels .js with; the
    # two legacy spellings below matched nothing, so the main bundle shipped
    # uncompressed at 549 KB instead of 167 KB while the CSS (matching
    # text/css) compressed fine. Keep the legacy names for anything that still
    # sends them. woff2 is already compressed — deliberately not listed.
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json;
    gzip_min_length 1024;
    
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
