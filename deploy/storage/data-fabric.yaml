---
# MinIO — S3-compatible unified storage gateway over Ceph + NVMe + object tiers
apiVersion: v1
kind: Namespace
metadata:
  name: data-fabric
  labels:
    name: data-fabric
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: data-fabric
spec:
  serviceName: minio
  replicas: 4
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /minio/v2/metrics/cluster
    spec:
      priorityClassName: neura-high
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: minio
              topologyKey: kubernetes.io/hostname
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-01-18T22-51-28Z
          command:
            - minio
            - server
            - http://minio-{0...3}.minio.data-fabric.svc.cluster.local/data{1...2}
            - --console-address=:9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
            - name: MINIO_CACHE
              value: on
            - name: MINIO_CACHE_DRIVES
              value: /cache
            - name: MINIO_CACHE_QUOTA
              value: "80"
            - name: MINIO_CACHE_AFTER
              value: "3"
            - name: MINIO_CACHE_WATERMARK_LOW
              value: "70"
            - name: MINIO_CACHE_WATERMARK_HIGH
              value: "95"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "16"
              memory: 32Gi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: data-1
              mountPath: /data1
            - name: data-2
              mountPath: /data2
            - name: nvme-cache
              mountPath: /cache
      volumes:
        - name: nvme-cache
          hostPath:
            path: /mnt/nvme0/minio-cache
            type: DirectoryOrCreate
  volumeClaimTemplates:
    - metadata:
        name: data-1
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Ti
    - metadata:
        name: data-2
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 10Ti
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: data-fabric
spec:
  clusterIP: None
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio-lb
  namespace: data-fabric
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
