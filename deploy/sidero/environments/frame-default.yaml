apiVersion: metal.sidero.dev/v1alpha2
kind: Environment
metadata:
  name: frame-default
  namespace: sidero-system
spec:
  # Replace <SCHEMATIC_ID> with the ID returned by:
  #   curl -X POST https://factory.talos.dev/schematics --data-binary @deploy/talos/schematics/worker-base.yaml
  # Use the same schematic ID in both initrd and kernel URLs.
  initrd:
    url: https://factory.talos.dev/image/<SCHEMATIC_ID>/v1.9.0/amd64/initramfs.xz
  kernel:
    url: https://factory.talos.dev/image/<SCHEMATIC_ID>/v1.9.0/amd64/vmlinuz
  talosVersion: v1.9.0
