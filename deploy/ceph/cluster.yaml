---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.2
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  waitTimeoutForHealthyOSDInMinutes: 10
  
  mon:
    count: 3
    allowMultiplePerNode: false
    
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: pg_autoscaler
        enabled: true
      - name: rook
        enabled: true
        
  dashboard:
    enabled: true
    ssl: true
    
  monitoring:
    enabled: true
    
  network:
    provider: host
    connections:
      # ponytail: encryption off — assumes the storage network (192.168.2.0/24
      # in the README diagram) is a physically isolated/trusted fabric. Flip
      # to true if the Ceph replication traffic shares a network segment
      # with anything untrusted; costs OSD throughput.
      encryption:
        enabled: false
      compression:
        enabled: false
    
  crashCollector:
    disable: false
    
  logCollector:
    enabled: true
    periodicity: daily
    maxLogSize: 500M
    
  cleanupPolicy:
    confirmation: ""
    sanitizeDisks:
      method: quick
      dataSource: zero
      iteration: 1
    allowUninstallWithVolumes: false
    
  resources:
    mon:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "2Gi"
    osd:
      limits:
        cpu: "4"
        memory: "8Gi"
      requests:
        cpu: "2"
        memory: "4Gi"
    mgr:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "2Gi"
        
  # storage.nodes below is an EXAMPLE for a 4-node, dual-NVMe layout.
  # Replace node names with `kubectl get nodes -o name` output and device
  # paths with each node's actual free disks (`lsblk` on the node, or use
  # Rook's device discovery: kubectl -n rook-ceph get cephcluster -o yaml
  # after a `useAllDevices: true` dry run). Devices must be raw, unpartitioned,
  # unformatted, and not the OS disk.
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "REPLACE_NODE_1"
        devices:
          - name: "REPLACE_DEVICE_1a" # e.g. /dev/nvme0n1
          - name: "REPLACE_DEVICE_1b" # e.g. /dev/nvme1n1
      - name: "REPLACE_NODE_2"
        devices:
          - name: "REPLACE_DEVICE_2a"
          - name: "REPLACE_DEVICE_2b"
      - name: "REPLACE_NODE_3"
        devices:
          - name: "REPLACE_DEVICE_3a"
          - name: "REPLACE_DEVICE_3b"
      - name: "REPLACE_NODE_4"
        devices:
          - name: "REPLACE_DEVICE_4a"
          - name: "REPLACE_DEVICE_4b"
