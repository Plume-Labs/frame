# Falco k8saudit plugin — ingests kube-apiserver audit events (no kernel driver)
# and routes detections to the EXISTING falcosidekick, so API-level attacks
# (privileged pod created, exec into pod, RBAC change, secret access, anonymous
# access) land in the same metric the Frame Security screen reads (source=k8s_audit).
#   helm upgrade -i falco-k8saudit falcosecurity/falco -n falco -f falco-k8saudit-values.yaml
driver: { enabled: false }
collectors: { enabled: false }
controller:
  kind: deployment
  deployment: { replicas: 1 }
falcoctl:
  artifact:
    install: { enabled: true }
    follow: { enabled: false }
  config:
    artifact:
      install:
        refs: [k8saudit-rules:0.11, k8saudit:0.11, json:0.7]
falco:
  rules_files:
    - /etc/falco/k8s_audit_rules.yaml
    - /etc/falco/rules.d
  plugins:
    - name: k8saudit
      library_path: libk8saudit.so
      init_config: ""
      open_params: "http://:9765/k8s-audit"
    - name: json
      library_path: libjson.so
      init_config: ""
  load_plugins: [k8saudit, json]
  json_output: true
  http_output:
    enabled: true
    url: "http://falco-falcosidekick.falco.svc.cluster.local:2801/"
falcosidekick: { enabled: false }
services:
  - name: webhook
    type: NodePort
    ports:
      - port: 9765
        nodePort: 32765
        protocol: TCP
# Local overrides of the upstream k8saudit rules (validated with falco -V, 2026-10-15).
customRules:
  k8saudit-overrides.yaml: |-
    # WebSocket exec/attach (kubectl >= 1.31) is audited as verb "get", not "create".
    - rule: Attach/Exec Pod
      condition: kevt_started and pod_subresource and (kcreate or ka.verb=get) and ka.target.subresource in (exec,attach) and not user_known_exec_pod_activities
      override:
        condition: replace
    # Kubelets request projected ServiceAccount tokens all day (~3,500/day here),
    # which this rule reports as ServiceAccount creations.
    - rule: K8s Serviceaccount Created
      condition: and not ka.user.name startswith "system:node:"
      override:
        condition: append
    - rule: Service Account Created in Kube Namespace
      condition: and not ka.user.name startswith "system:node:"
      override:
        condition: append
    # k3s's embedded cloud controller patches node status.
    - list: allowed_k8s_users
      items: [k3s-cloud-controller-manager]
      override:
        items: append
