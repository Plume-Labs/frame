apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: dcgm, namespace: gpu-operator, labels: { release: kps } }
spec:
  selector: { matchLabels: { app: nvidia-dcgm-exporter } }
  endpoints: [{ port: gpu-metrics, interval: 30s }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: tetragon, namespace: tetragon, labels: { release: kps } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: tetragon } }
  endpoints: [{ port: metrics, interval: 30s }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: falcosidekick, namespace: falco, labels: { release: kps } }
spec:
  selector: { matchLabels: { app.kubernetes.io/name: falcosidekick } }
  endpoints: [{ port: http, interval: 30s }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: node-exporter, namespace: monitoring, labels: { release: kps } }
spec:
  selector: { matchLabels: { app: node-exporter } }
  podMetricsEndpoints: [{ port: metrics, interval: 30s }]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: llamacpp, namespace: inference, labels: { release: kps } }
spec:
  selector: { matchLabels: { app: llamacpp } }
  podMetricsEndpoints: [{ port: http, path: /metrics, interval: 30s }]
