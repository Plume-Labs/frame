# Example subscription: relay every cluster alert except the two meta alerts
# (defaulted) to an application's Alertmanager-compatible webhook.
#
# The token Secret must already exist in frame-system and carry the label
# frame.plume-labs.io/alert-token: "true" (required: the relay refuses to
# read, and send, any token Secret without that label). Seal it with
# sealed-secrets rather than committing it in clear.
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameAlertSubscription
metadata:
  name: my-app
  namespace: frame-system
spec:
  url: http://my-app-api.my-app.svc.cluster.local:3000/alerts/webhook
  tokenSecretRef:
    name: my-app-alert-webhook
    key: token
