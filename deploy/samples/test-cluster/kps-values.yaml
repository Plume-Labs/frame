nodeExporter: { enabled: false }   # reuse existing monitoring/node-exporter
# k3s embeds controller-manager/scheduler/proxy in one process — they have no
# separate scrape target, so these default rules fire false "Down" alerts. Off.
defaultRules:
  rules:
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false
    etcd: false
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
alertmanager:
  config:
    route:
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
      routes:
        # Neura first, with `continue`: every alert still reaches the routes
        # below. Meta alerts would open never-closing incidents. Neura reads
        # them into it.incidents (POST /api/it/alerts/webhook, bearer token).
        - matchers: [alertname !~ "Watchdog|InfoInhibitor"]
          receiver: neura
          continue: true
        - matchers: [severity = "critical"]
          receiver: critical
        # Explicit catch-all: once the neura route has matched, the parent's
        # `receiver: default` is no longer used — without this, non-critical
        # alerts would stop reaching alert-sink (checked with amtool routes test).
        - receiver: default
    receivers:
      # On-cluster webhook sink (verifiable without external creds). Swap for
      # Slack/email/PagerDuty for real fan-out — see the commented block below.
      - name: default
        webhook_configs:
          - url: http://alert-sink.monitoring.svc.cluster.local:80/
            send_resolved: true
      - name: critical
        webhook_configs:
          - url: http://alert-sink.monitoring.svc.cluster.local:80/critical
            send_resolved: true
      # Token shared with neura-neura-secret/IT_ALERT_WEBHOOK_TOKEN, sealed in
      # neura-alert-webhook.sealed.yaml next to this file.
      - name: neura
        webhook_configs:
          - url: http://neura-neura-api.neura.svc.cluster.local:3000/api/it/alerts/webhook
            send_resolved: true
            max_alerts: 100   # Neura rejects more per request (MAX_ALERTES_PAR_REQUETE)
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/neura-alert-webhook/token
      # - name: critical
      #   slack_configs:
      #     - api_url_file: /etc/alertmanager/secrets/slack/url   # from a Secret
      #       channel: '#alerts'
      #       send_resolved: true
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: [alertname, namespace]
  alertmanagerSpec:
    secrets: [neura-alert-webhook]   # mounted under /etc/alertmanager/secrets/
    resources: { requests: { cpu: 20m, memory: 64Mi } }
    storage:
      volumeClaimTemplate:
        spec: { storageClassName: ceph-rbd, accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
grafana:
  # No hardcoded password — the chart generates a random one into the
  # `kps-grafana` Secret. Retrieve it with:
  #   kubectl -n monitoring get secret kps-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  defaultDashboardsTimezone: browser
  service: { type: NodePort, nodePort: 30300 }
  persistence: { enabled: true, storageClassName: ceph-rbd, size: 2Gi }
  resources: { requests: { cpu: 50m, memory: 128Mi } }
kube-state-metrics:
  resources: { requests: { cpu: 20m, memory: 64Mi } }
prometheus:
  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources: { requests: { cpu: 200m, memory: 512Mi } }
    storageSpec:
      volumeClaimTemplate:
        spec: { storageClassName: ceph-rbd, accessModes: [ReadWriteOnce], resources: { requests: { storage: 8Gi } } }
