nodeExporter: { enabled: false }   # reuse existing monitoring/node-exporter
# k3s embeds controller-manager/scheduler/proxy in one process — they have no
# separate scrape target, so these default rules fire false "Down" alerts. Off.
defaultRules:
  rules:
    kubeControllerManager: false
    kubeScheduler: false
    kubeProxy: false
    etcd: false
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
alertmanager:
  config:
    route:
      # '...' is Alertmanager's special group_by value: group by every label,
      # i.e. one alert per group per notification. Finding 2 (2026-09-15):
      # grouping by [alertname, severity] let a single group exceed
      # max_alerts, silently truncating alerts (and their resolutions)
      # beyond the cap. One alert per notification removes the cap's ceiling
      # entirely, at the cost of one webhook POST per alert instead of one
      # per group.
      group_by: ['...']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: default
      routes:
        - matchers: [severity = "critical"]
          receiver: critical
    receivers:
      # Frame's alert receiver records every alert (FrameAlert) and relays it
      # to tenant subscriptions — see docs/superpowers/specs/2026-09-15-alert-relay-design.md.
      # `critical` stays a separate receiver so critical routing (grouping,
      # future fan-out) can diverge without touching the default path.
      - name: default
        webhook_configs:
          - url: http://frame-alert-receiver.frame-system.svc:8445/alertmanager
            send_resolved: true
            # Safety net only: with group_by: ['...'] above, every
            # notification carries exactly one alert, so this can no longer
            # be reached.
            max_alerts: 100
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/frame-alert-receiver-token/token
      - name: critical
        webhook_configs:
          - url: http://frame-alert-receiver.frame-system.svc:8445/alertmanager
            send_resolved: true
            # Safety net only: see the `default` receiver above.
            max_alerts: 100
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/frame-alert-receiver-token/token
      # - name: critical
      #   slack_configs:
      #     - api_url_file: /etc/alertmanager/secrets/slack/url   # from a Secret
      #       channel: '#alerts'
      #       send_resolved: true
    inhibit_rules:
      - source_matchers: [severity = "critical"]
        target_matchers: [severity = "warning"]
        equal: [alertname, namespace]
  alertmanagerSpec:
    secrets: [frame-alert-receiver-token]   # mounted under /etc/alertmanager/secrets/
    resources: { requests: { cpu: 20m, memory: 64Mi } }
    storage:
      volumeClaimTemplate:
        spec: { storageClassName: ceph-rbd, accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
grafana:
  # No hardcoded password — the chart generates a random one into the
  # `kps-grafana` Secret. Retrieve it with:
  #   kubectl -n monitoring get secret kps-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  defaultDashboardsTimezone: browser
  service: { type: NodePort, nodePort: 30300 }
  persistence: { enabled: true, storageClassName: ceph-rbd, size: 2Gi }
  resources: { requests: { cpu: 50m, memory: 128Mi } }
kube-state-metrics:
  resources: { requests: { cpu: 20m, memory: 64Mi } }
prometheus:
  prometheusSpec:
    retention: 3d
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources: { requests: { cpu: 200m, memory: 512Mi } }
    storageSpec:
      volumeClaimTemplate:
        spec: { storageClassName: ceph-rbd, accessModes: [ReadWriteOnce], resources: { requests: { storage: 8Gi } } }
