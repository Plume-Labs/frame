# Ceph RGW object store (S3) — backing store for Velero backups (DR).
# Rook creates the RGW gateway + pools; ceph-bucket StorageClass provisions
# buckets via ObjectBucketClaim.
apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata: { name: neura-s3, namespace: rook-ceph }
spec:
  metadataPool: { failureDomain: host, replicated: { size: 2 } }
  dataPool: { failureDomain: host, replicated: { size: 2 } }
  preservePoolsOnDelete: false
  gateway: { port: 80, instances: 1 }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: ceph-bucket }
provisioner: rook-ceph.ceph.rook.io/bucket
reclaimPolicy: Delete
parameters:
  objectStoreName: neura-s3
  objectStoreNamespace: rook-ceph
---
# Bucket for Velero — Rook fills the velero-backups ConfigMap (bucket name/host)
# and Secret (S3 keys) in the velero namespace.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata: { name: velero-backups, namespace: velero }
spec:
  generateBucketName: velero
  storageClassName: ceph-bucket
