# Test-cluster sample workloads: Frame CRs, Volcano queues + a vcjob, and an
# Argo DAG workflow. These give the live Frame UI screens real data to read
# (Jobs, Service Classes, Scheduler, Elastic Pools, Lineage).
#
# Apply after the operators (Frame, Volcano, Argo) are up:
#   kubectl apply -f deploy/samples/test-cluster/workloads.yaml
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameNode
metadata: { name: node-cp, namespace: default }
spec:
  ip: 192.0.2.201
  role: controlplane
  serviceClass: HIGH
  rack: rack-01
  zone: local
  network: { address: 192.0.2.201/24, gateway: 192.0.2.254, dns: [192.0.2.254] }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameNode
metadata: { name: node-w1, namespace: default }
spec:
  ip: 192.0.2.202
  role: worker
  serviceClass: MEDIUM
  rack: rack-01
  zone: local
  network: { address: 192.0.2.202/24, gateway: 192.0.2.254, dns: [192.0.2.254] }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameNode
metadata: { name: node-w2, namespace: default }
spec:
  ip: 192.0.2.203
  role: worker
  serviceClass: LOW
  rack: rack-01
  zone: local
  network: { address: 192.0.2.203/24, gateway: 192.0.2.254, dns: [192.0.2.254] }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: SchedulingPolicy
metadata: { name: acme-default, namespace: default }
spec: { scheduler: volcano, queueName: acme-high, queueWeight: 100, preemption: true, priorityClass: acme-high, priorityValue: 100 }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameResourceQuota
metadata: { name: quota-high, namespace: default }
spec: { serviceClass: HIGH, maxGPUs: 0, maxCPU: "8", maxMemory: 16Gi, maxJobs: 20 }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameResourceQuota
metadata: { name: quota-medium, namespace: default }
spec: { serviceClass: MEDIUM, maxGPUs: 0, maxCPU: "4", maxMemory: 8Gi, maxJobs: 10 }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameResourceQuota
metadata: { name: quota-low, namespace: default }
spec: { serviceClass: LOW, maxGPUs: 0, maxCPU: "2", maxMemory: 4Gi, maxJobs: 5 }
---
# Argo >= 3.4 has every workflow pod report back by creating a
# workflowtaskresult. The cluster-scoped install grants that only in `argo`, so
# a workflow running anywhere else dies with `workflowtaskresults.argoproj.io is
# forbidden`. Frame puts the Workflow in the FrameJob's own namespace, so every
# namespace holding a FrameJob needs this pair bound to the ServiceAccount the
# pods run as. (v1alpha1 let spec.namespace name a different one; that field is
# gone at v1beta1 — F5.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: argo-workflow-executor, namespace: default }
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-workflow-executor, namespace: default }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-workflow-executor }
subjects:
  - { kind: ServiceAccount, name: default, namespace: default }
---
# The two FrameJobs below reference these by spec.pipeline. Frame creates the
# Argo Workflow in the FrameJob's own namespace and a Workflow only resolves a
# WorkflowTemplate in its OWN namespace, so these must live in `default` next to
# the jobs — not in `argo`. Without them the Workflow fails immediately with
# `workflowtemplates.argoproj.io "..." not found`; that stayed invisible for as
# long as the controller ran --namespaced and never reconciled them at all.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata: { name: inference-dag, namespace: default }
spec:
  entrypoint: dag
  templates:
    - name: dag
      dag:
        tasks:
          - { name: fetch-batch, template: step }
          - { name: embed, template: step, dependencies: [fetch-batch] }
          - { name: upsert, template: step, dependencies: [embed] }
    - name: step
      container:
        image: busybox:1.37
        command: [sh, -c, "sleep 5"]
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata: { name: training-dag, namespace: default }
spec:
  entrypoint: dag
  templates:
    - name: dag
      dag:
        tasks:
          - { name: gather, template: step }
          - { name: consolidate, template: step, dependencies: [gather] }
    - name: step
      container:
        image: busybox:1.37
        command: [sh, -c, "sleep 5"]
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameJob
metadata: { name: acme-embed-refresh, namespace: default }
spec: { pipeline: inference-dag, serviceClass: HIGH, priority: high, gpuCount: 0 }
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameJob
metadata: { name: nightly-consolidation, namespace: default }
spec: { pipeline: training-dag, serviceClass: LOW, priority: low, gpuCount: 0 }
---
# ── Volcano queues (elastic pools) ──────────────────────────────────────────
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata: { name: acme-high }
spec: { weight: 100, reclaimable: false, capability: { cpu: "8", memory: 16Gi } }
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata: { name: acme-medium }
spec: { weight: 50, reclaimable: true, capability: { cpu: "4", memory: 8Gi } }
---
apiVersion: scheduling.volcano.sh/v1beta1
kind: Queue
metadata: { name: acme-low }
spec: { weight: 10, reclaimable: true, capability: { cpu: "2", memory: 4Gi } }
---
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata: { name: acme-embed-batch, namespace: default }
spec:
  minAvailable: 2
  schedulerName: volcano
  queue: acme-high
  tasks:
    - replicas: 2
      name: worker
      template:
        spec:
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 3600"]
              resources: { requests: { cpu: 200m, memory: 128Mi } }
          restartPolicy: Never
---
# ── Argo executor RBAC (Argo 3.4+ needs workflowtaskresults) ─────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: argo-executor, namespace: argo }
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: argo-executor, namespace: argo }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: argo-executor }
subjects: [{ kind: ServiceAccount, name: argo, namespace: argo }]
---
# ── Argo DAG that exercises a live application (Lineage) ─────────────────────
# Steps curl the application's real services (here an example `acme` Helm
# release), so the run's success/latency reflect its real state — not a
# synthetic sleep pipeline. Point the URLs at your own services.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata: { name: acme-api-pipeline, namespace: argo }
spec:
  entrypoint: main
  serviceAccountName: argo
  templates:
    - name: main
      dag:
        tasks:
          - { name: api-health, template: curl, arguments: { parameters: [{ name: path, value: "/api/health" }] } }
          - { name: db-ready, template: curl, dependencies: [api-health], arguments: { parameters: [{ name: path, value: "/api/health" }] } }
          - { name: client-reachable, template: curlsvc, dependencies: [api-health], arguments: { parameters: [{ name: url, value: "http://acme-acme-client.acme.svc.cluster.local:80/" }] } }
          - { name: done, template: curl, dependencies: [db-ready, client-reachable], arguments: { parameters: [{ name: path, value: "/api/health" }] } }
    - name: curl
      inputs: { parameters: [{ name: path }] }
      container: { image: curlimages/curl:8.10.1, args: ["-fsS", "--retry", "3", "--max-time", "10", "http://acme-acme-api.acme.svc.cluster.local:3000{{inputs.parameters.path}}"] }
    - name: curlsvc
      inputs: { parameters: [{ name: url }] }
      container: { image: curlimages/curl:8.10.1, args: ["-fsS", "--retry", "3", "--max-time", "10", "{{inputs.parameters.url}}"] }
