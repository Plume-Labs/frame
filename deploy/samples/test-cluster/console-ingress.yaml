# The console's HTTPS origin — an example: replace console.example.com with
# the name your console is reached at.
#
# WebAuthn needs a secure context and authd's session cookie is `Secure`, so
# the NodePort the console was reached on (http://<node>:30379) can carry
# neither: the browser refuses to store the cookie and does not expose
# navigator.credentials at all. This gives the console a real origin —
# https://console.example.com — which is also, and not incidentally, the value
# authd's RP_ID must hold. Changing that hostname later invalidates every
# enrolled passkey, so it is chosen once, here.
#
# TLS is terminated by Traefik inside the cluster, not by an edge proxy that
# also serves public applications: the console must not be reachable from the
# WAN. Point the DNS A record at a private address, so the name resolves
# everywhere and answers only on the LAN.
#
# The certificate is issued by `frame-auth-ca`, the same in-cluster CA that
# already issues authd's serving certificate, rather than by a new one — one
# root to trust on each device you sign in from instead of two.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frame-console-tls
  namespace: cluster-control
spec:
  secretName: frame-console-tls
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: console.example.com
  dnsNames:
    - console.example.com
  issuerRef:
    name: frame-auth-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluster-control-console
  namespace: cluster-control
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - console.example.com
      secretName: frame-console-tls
  rules:
    - host: console.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cluster-control-ui
                port:
                  name: http
