# Dedicated embeddings server (HuggingFace Text Embeddings Inference) on CPU.
# Neura's embeddings are a separate service from chat — a generative model does
# not serve embeddings. gte-multilingual-base: 768 dims (matches Neura's pgvector
# schema), multilingual (FR), prefix-free (no "query:"/"passage:" needed).
# CPU-only: no nvidia.com/gpu, so it never contends with llama.cpp on the P4.
#   Neura points at it via AI_EMBEDDING_BASE_URL=http://tei.inference:80
apiVersion: apps/v1
kind: Deployment
metadata: { name: tei, namespace: inference, labels: { app: tei } }
spec:
  replicas: 1
  selector: { matchLabels: { app: tei } }
  template:
    metadata: { labels: { app: tei } }
    spec:
      # Placement measured, not guessed. Left to the default scheduler this
      # landed on the control plane, which sits at ~99% CPU: 24-32s of
      # inference plus 34-67s of queueing per batch. Off it, the same batch
      # takes 1.7s with 0.6ms of queueing — a 35x difference that turned a
      # document backfill from ~20h into ~1h.
      #
      # An anti-affinity on the control-plane role, not a nodeSelector pinning
      # one named worker: a pinned node does not survive being replaced, and
      # the scheduler picks the emptiest worker on its own — which is the
      # right answer whenever the cluster's shape changes.
      #
      # It also must not land on whichever node runs Postgres if that node is
      # tight on memory: TEI reserves 3Gi, and crowding the database node
      # killed the postgres process (restarted in-place by Patroni, 286
      # documents failed with ECONNREFUSED) during that same backfill.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
          # --max-batch-tokens caps warmup peak memory (gte ctx=8192 would OOM otherwise).
          args:
            - "--model-id"
            - "Alibaba-NLP/gte-multilingual-base"
            - "--port"
            - "80"
            - "--auto-truncate"
            - "--max-batch-tokens"
            - "4096"
            - "--max-client-batch-size"
            - "8"
          ports: [{ containerPort: 80, name: http }]
          env:
            - { name: HF_HOME, value: /data }
          # 2500m and not 1: embeddings are CPU-bound here, and a single core
          # is what made a batch of 8 take a minute. The request is what the
          # scheduler reserves, so it also keeps TEI off a node that has
          # nothing left to give.
          resources:
            requests: { cpu: 2500m, memory: 3Gi }
            limits: { memory: 6Gi }
          volumeMounts: [{ name: cache, mountPath: /data }]
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 3Gi }
---
apiVersion: v1
kind: Service
metadata: { name: tei, namespace: inference }
spec:
  selector: { app: tei }
  ports: [{ port: 80, targetPort: 80, name: http }]
