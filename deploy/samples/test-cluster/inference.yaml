apiVersion: v1
kind: Namespace
metadata: { name: inference }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: llamacpp-models, namespace: inference }
spec:
  # Model cache (~18.5GB GGUF). On an emptyDir this re-downloaded on every pod
  # restart (~10 min + node disk pressure); ceph-rbd makes it survive restarts.
  # RWO is fine: strategy is Recreate, so only one pod ever mounts it.
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources: { requests: { storage: 25Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: llamacpp, namespace: inference, labels: { app: llamacpp } }
spec:
  replicas: 1
  selector: { matchLabels: { app: llamacpp } }
  # Single GPU + replicas:1: RollingUpdate would surge a second pod that blocks
  # forever waiting for the one GPU the old pod still holds. Recreate kills the
  # old pod first (brief downtime) so the new one can claim the GPU.
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: llamacpp } }
    spec:
      runtimeClassName: nvidia
      containers:
        - name: server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda
          # Qwen3-30B-A3B (MoE, 3B active) on a 7.68GB P4. -ngl 99 puts all
          # attention/non-expert weights on the GPU; -ncmoe 34 keeps the experts
          # of the first 34 (of 48) layers on the CPU, leaving 14 layers' experts
          # on the GPU (~4.8GB, filling VRAM to ~6.3GB). Blanket `-ot exps=CPU`
          # left 6GB of VRAM idle and made prefill ~30s.
          # --load-mode none replaces the deprecated --no-mmap: mmap-ing tensors
          # that are overridden to CPU is what llama.cpp warns against.
          # --jinja enables the model's chat template (Qwen3 tool-call parsing).
          args:
            - "-hf"
            - "unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "-ngl"
            - "99"
            - "-ncmoe"
            - "34"
            - "--load-mode"
            - "none"
            - "--jinja"
            - "--metrics"
            - "-c"
            - "4096"
          ports: [{ containerPort: 8080, name: http }]
          env:
            - { name: LLAMA_CACHE, value: /models }
          # No CPU/memory requests: the cluster nodes are already heavily
          # request-reserved, and runtime RAM (~23GB free on w2) covers the
          # CPU-offloaded experts. The GPU limit alone pins scheduling to w2.
          resources:
            limits: { nvidia.com/gpu: 1 }
          volumeMounts: [{ name: models, mountPath: /models }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 120
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: llamacpp-models }
---
apiVersion: v1
kind: Service
metadata: { name: llamacpp, namespace: inference }
spec:
  selector: { app: llamacpp }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
