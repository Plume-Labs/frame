apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rdma-network
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "rdma-network",
      "type": "macvlan",
      "master": "ib0",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.250"
      }
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: roce-network
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "roce-network",
      "type": "ipvlan",
      "master": "enp1s0f0",
      "mode": "l2",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.101.0/24"
      }
    }
