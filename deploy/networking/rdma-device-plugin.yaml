apiVersion: v1
kind: ConfigMap
metadata:
  name: rdma-device-plugin
  namespace: kube-system
data:
  config.json: |
    {
      "periodicUpdateInterval": 300,
      "configList": [
        {
          "resourceName": "rdma/hca",
          "rdmaHcaMax": 1000,
          "devices": ["mlx5_0", "mlx5_1"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rdma-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: rdma-device-plugin
  template:
    metadata:
      labels:
        name: rdma-device-plugin
    spec:
      hostNetwork: true
      nodeSelector:
        rdma: "true"
      containers:
        - name: rdma-device-plugin
          image: ghcr.io/mellanox/k8s-rdma-shared-dev-plugin:v1.5.1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: config
              mountPath: /etc/rdma
            - name: devfs
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: config
          configMap:
            name: rdma-device-plugin
        - name: devfs
          hostPath:
            path: /dev
