name: Tests

on:
  push:
  pull_request:

permissions: {}

# One run per workflow, event and ref: a new push to a PR branch (Renovate
# rebases included) cancels the run it supersedes. main and release tags are
# never cancelled, so every commit there keeps its full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # internal/provision builds and inspects real installer ISOs with
      # xorriso, and fails (deliberately, not skips) when it is missing: an
      # image-building lot whose image tests silently skip proves nothing.
      # ubuntu-latest does not ship it.
      - name: Install xorriso
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso

      - name: Running Tests
        run: |
          go mod tidy
          make test

      # Runs after the tests rather than before, so a vulnerability in a
      # dependency never masks a real test failure in the diff under review.
      # govulncheck reports only vulnerabilities on a code path this module
      # actually reaches, so a finding here is genuinely reachable, not just
      # present in go.sum.
      #
      # Blocking. It was added report-only on 2026-08-09 because two reachable
      # vulnerabilities existed at the time (GO-2026-6061 in grpc, GO-2026-5970
      # in x/text) and shipping a red CI alongside the step that detects it
      # helps nobody. Both were bumps rather than code changes, they landed,
      # and the step was closed in that same change — which is the only reason
      # a temporarily-open gate is an honest thing to ship.
      - name: Go vulnerability scan
        run: make vuln

      - name: Coverage threshold
        run: |
          # cover.out format: file:start,end numstmts hitcount
          # Filter to internal/controller, compute covered statements / total statements.
          pct=$(grep 'github.com/Plume-Labs/frame/internal/controller/' cover.out \
            | awk '{ total+=$2; if ($3>0) covered+=$2 } END { printf "%.1f", (total>0 ? covered*100/total : 0) }')
          echo "Controller coverage: ${pct}%"
          awk -v p="${pct}" 'BEGIN { if (p+0 < 45) { print "FAIL: controller coverage " p "% < 45%"; exit 1 } }'
