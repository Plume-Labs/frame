name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      # Runs after the tests rather than before, so a vulnerability in a
      # dependency never masks a real test failure in the diff under review.
      # govulncheck reports only vulnerabilities on a code path this module
      # actually reaches, so a finding here is genuinely reachable, not just
      # present in go.sum.
      #
      # Report-only for now. As of 2026-08-09 this already reports two
      # reachable vulnerabilities in the current dependency set:
      #
      #   GO-2026-6061  google.golang.org/grpc  v1.81.0 -> fixed in v1.82.1
      #   GO-2026-5970  golang.org/x/text       v0.37.0 -> fixed in v0.39.0
      #
      # Both are dependency bumps, not code changes, and neither is in scope
      # for the change that added this step — so the step is added open rather
      # than either shipping a red CI or quietly not adding it at all. Flip
      # continue-on-error off in the same change that lands those two bumps.
      - name: Go vulnerability scan
        continue-on-error: true
        run: make vuln

      - name: Coverage threshold
        run: |
          # cover.out format: file:start,end numstmts hitcount
          # Filter to internal/controller, compute covered statements / total statements.
          pct=$(grep 'github.com/rmocq/frame/internal/controller/' cover.out \
            | awk '{ total+=$2; if ($3>0) covered+=$2 } END { printf "%.1f", (total>0 ? covered*100/total : 0) }')
          echo "Controller coverage: ${pct}%"
          awk -v p="${pct}" 'BEGIN { if (p+0 < 45) { print "FAIL: controller coverage " p "% < 45%"; exit 1 } }'
