name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  SMOKE_RETRIES: '15'
  SMOKE_RETRY_DELAY_SECONDS: '2'

jobs:
  # ── 1. Quality gate: lint + typecheck + unit tests ────────────────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Unit tests
        run: npm test

  # ── 2. IaC validation: render and dry-run Kubernetes + script checks ──────
  iac:
    name: IaC Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xzC /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Kubernetes manifests (base + overlays)
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/k8s-base.yaml
          kubectl kustomize deploy/kubernetes/overlays/development > /tmp/k8s-development.yaml
          kubectl kustomize deploy/kubernetes/overlays/production > /tmp/k8s-production.yaml
          for manifest in /tmp/k8s-base.yaml /tmp/k8s-development.yaml /tmp/k8s-production.yaml; do
            kubeconform -summary -strict -ignore-missing-schemas "${manifest}"
          done

      - name: Validate deploy script syntax
        run: |
          for dir in deploy/scripts deploy/gitops; do
            [ -d "${dir}" ] || continue
            while IFS= read -r -d '' script; do
              echo "Checking ${script}"
              bash -n "${script}"
            done < <(find "${dir}" -type f -name '*.sh' -print0)
          done

  # ── 3. Build and push container image ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, iac]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Integration test on a kind virtual cluster ─────────────────────────
  integration:
    name: Integration (kind)
    runs-on: ubuntu-latest
    needs: [quality, iac]
    steps:
      - uses: actions/checkout@v4

      - name: Build image for kind
        run: docker build -t cluster-control:ci .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cluster-control-ci

      - name: Load image into cluster
        run: kind load docker-image cluster-control:ci --name cluster-control-ci

      - name: Deploy manifests
        run: |
          kubectl apply -f deploy/kubernetes/base/namespace.yaml
          kubectl apply -f deploy/kubernetes/base/rbac.yaml
          kubectl apply -f deploy/kubernetes/base/service.yaml
          kubectl create --dry-run=client -f deploy/kubernetes/base/deployment.yaml -o yaml \
            | kubectl set image --local -f - ui=cluster-control:ci -o yaml \
            | kubectl apply -f -
          kubectl -n cluster-control scale deployment/cluster-control-ui --replicas=1

      - name: Wait for rollout
        run: kubectl -n cluster-control rollout status deployment/cluster-control-ui --timeout=120s

      - name: Smoke test
        run: |
          kubectl -n cluster-control port-forward svc/cluster-control-ui 8080:80 &
          for attempt in $(seq 1 "${SMOKE_RETRIES}"); do
            echo "Smoke check attempt ${attempt}/${SMOKE_RETRIES}"
            status_code="$(curl -sS -o /tmp/cluster-control-smoke.html -w '%{http_code}' http://localhost:8080/ || true)"
            if [ "${status_code}" = "200" ]; then
              exit 0
            fi
            echo "Smoke check failed with HTTP ${status_code}"
            head -n 5 /tmp/cluster-control-smoke.html || true
            if [ "${attempt}" -lt "${SMOKE_RETRIES}" ]; then
              sleep "${SMOKE_RETRY_DELAY_SECONDS}"
            fi
          done
          echo "Smoke test failed: service did not become reachable" >&2
          exit 1

  # ── 5. Create a versioned release package on tags ─────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Render production manifest
        run: |
          kustomize build deploy/kubernetes/overlays/production/ > cluster-control-${{ github.ref_name }}.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cluster-control-${{ github.ref_name }}.yaml
          generate_release_notes: true
