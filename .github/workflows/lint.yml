name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3 # matches the helm version used for local development

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      - name: Verify Helm chart CRDs are in sync with config/crd/bases
        run: make helm-crds-check
      - name: Lint Helm chart
        run: make helm-lint
      - name: Check Helm/kustomize parity
        run: make helm-parity
