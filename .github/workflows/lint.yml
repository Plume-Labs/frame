name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1 # matches the helm version used for local development

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      - name: Verify Helm chart CRDs are in sync with config/crd/bases
        run: make helm-crds-check
      - name: Lint Helm chart
        run: make helm-lint
      - name: Check Helm/kustomize parity
        run: make helm-parity
