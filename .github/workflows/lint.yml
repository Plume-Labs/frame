name: Lint

on:
  push:
  pull_request:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1 # matches the helm version used for local development

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

      - name: Verify Helm chart CRDs are in sync with config/crd/bases
        run: make helm-crds-check
      - name: Lint Helm chart
        run: make helm-lint
      - name: Check Helm/kustomize parity
        run: make helm-parity
