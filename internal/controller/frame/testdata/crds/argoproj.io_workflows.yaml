# Test-only stand-in for Argo Workflows' workflows.argoproj.io CRD.
#
# Frame does not own this CRD (it is Argo's), so it is not generated by
# controller-gen and does not belong in config/crd/bases. It exists purely so
# envtest's apiserver knows the "argoproj.io/v1alpha1 Workflow" kind: without
# it, framejob_controller's r.Create/r.Get/r.Patch against an unstructured
# Workflow fail client-side with meta.NoKindMatchError before any HTTP call is
# made, because there is nothing for discovery to find. The schema is
# deliberately wide open (no status subresource) so tests can read/write
# spec and status through a single plain Update, matching what
# framejob_controller.go and its tests do against the real Workflow CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.argoproj.io
spec:
  group: argoproj.io
  names:
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    singular: workflow
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
