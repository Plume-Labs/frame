# Test-only stand-in for Volcano's scheduling.volcano.sh Queue CRD.
#
# Frame does not own this CRD (it is Volcano's), so it is not generated by
# controller-gen and does not belong in config/crd/bases — same reasoning as
# argoproj.io_workflows.yaml and batch.volcano.sh_jobs.yaml beside this file.
#
# It exists because the SchedulingPolicy ownership specs need a Queue that can
# actually be created, read back and refused. Without it,
# schedulingpolicy_controller.go's Get/CreateOrUpdate/Delete against an
# unstructured Queue fail client-side with meta.NoKindMatchError before any
# HTTP call is made, so "a foreign Queue is not adopted" could not be told
# apart from "no Queue kind exists" — which is exactly the branch the fix has
# to keep distinct (queueKindUnavailable).
#
# scope: Cluster is the load-bearing line, and it is copied from the live
# cluster (`kubectl get crd queues.scheduling.volcano.sh -o jsonpath=
# '{.spec.scope}'` returns Cluster). A Namespaced fixture would make every
# ownership spec here pass while proving nothing about the defect, which is
# that a namespaced right to write a SchedulingPolicy reached a cluster-scoped
# object.
#
# The schema is wide open (type: object, x-kubernetes-preserve-unknown-fields)
# for the same reason as the two sibling fixtures: everything Frame writes
# under spec — weight, reclaimable, preemption — goes through plain scalar
# paths that exist unchanged in the real Volcano CRD. What this fixture cannot
# catch: the real CRD's own validation and defaulting (spec.weight is
# format: int32 there, and Frame writes an int64 into the unstructured map),
# the status subresource the real CRD declares, and Volcano's own admission
# webhook — volcano-admission-service-queues-validate, registered on CREATE,
# UPDATE *and* DELETE, which is what actually refuses to delete the "default"
# queue on a real cluster. Frame refuses that name itself
# (reservedQueueNames) rather than relying on a webhook it does not install.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: queues.scheduling.volcano.sh
spec:
  group: scheduling.volcano.sh
  names:
    kind: Queue
    listKind: QueueList
    plural: queues
    singular: queue
    shortNames:
      - q
  scope: Cluster
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
