# Test-only stand-in for Volcano's batch.volcano.sh Job (vcjob) CRD.
#
# Frame does not own this CRD (it is Volcano's), so it is not generated by
# controller-gen and does not belong in config/crd/bases — same reasoning as
# argoproj.io_workflows.yaml beside this file. It exists purely so envtest's
# apiserver knows the "batch.volcano.sh/v1alpha1 Job" kind: without it,
# framejob_container.go's r.Create/r.Get/r.Delete against an unstructured
# Volcano Job fail client-side with meta.NoKindMatchError before any HTTP
# call is made, because there is nothing for discovery to find.
#
# The schema is wide open (type: object, x-kubernetes-preserve-unknown-fields,
# no status subresource) for the same reason as the Argo fixture: every
# read/write Frame does against a Volcano Job goes through
# unstructured.NestedString/NestedSlice/SetNestedField against plain scalar
# paths — spec.schedulerName, spec.queue, spec.minAvailable, spec.tasks[],
# spec.priorityClassName, status.state.phase, status.state.message — that
# exist unchanged in the real Volcano CRD. No status subresource means a
# plain Update can set status.state.phase, matching what both the controller
# (via r.Status().Patch on the FrameJob, not the Volcano Job) and this
# package's tests do for the Argo Workflow fixture. What this fixture cannot
# catch: the real CRD's own validation, defaulting, or Volcano's own
# admission webhook rejecting a shape Frame sends — that risk lives with
# whatever installs Volcano for real, not with this test double.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobs.batch.volcano.sh
spec:
  group: batch.volcano.sh
  names:
    kind: Job
    listKind: JobList
    plural: jobs
    singular: job
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
