# Volumes and alerts for `make demo`. Two real PVCs on Kind's local-path
# class (bound by the pod below: local-path waits for a first consumer), and
# two firing FrameAlerts in the shape the alert receiver writes for Alertmanager.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-workloads
  labels: {hearthrack.demo/seeded: "true"}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-datasets
  namespace: demo-workloads
  labels: {hearthrack.demo/seeded: "true"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-checkpoints
  namespace: demo-workloads
  labels: {hearthrack.demo/seeded: "true"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-volume-user
  namespace: demo-workloads
  labels: {hearthrack.demo/seeded: "true"}
spec:
  containers:
    - name: sleep
      image: busybox:1.37
      command: ["sleep", "86400"]
      volumeMounts:
        - {name: datasets, mountPath: /datasets}
        - {name: checkpoints, mountPath: /checkpoints}
  volumes:
    - name: datasets
      persistentVolumeClaim: {claimName: demo-datasets}
    - name: checkpoints
      persistentVolumeClaim: {claimName: demo-checkpoints}
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameAlert
metadata:
  name: demo-alert-disk-pressure
  namespace: frame-system
  labels: {hearthrack.demo/seeded: "true"}
spec:
  fingerprint: "d3a10c0ffee00001"
  alertName: NodeDiskPressure
  severity: warning
  startsAt: "2026-01-01T00:00:00Z"
  labels: {rack: rack-b}
  annotations: {summary: "Demo data: a fictional disk-pressure alert in rack-b."}
---
apiVersion: frame.plume-labs.io/v1beta1
kind: FrameAlert
metadata:
  name: demo-alert-pump-flow
  namespace: frame-system
  labels: {hearthrack.demo/seeded: "true"}
spec:
  fingerprint: "d3a10c0ffee00002"
  alertName: CoolingLoopLowFlow
  severity: critical
  startsAt: "2026-01-01T00:00:00Z"
  labels: {rack: rack-a}
  annotations: {summary: "Demo data: a fictional cooling-loop alert on rack-a."}
