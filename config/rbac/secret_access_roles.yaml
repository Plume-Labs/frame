# Secrets outside the manager's own namespace. Neither ClusterRole is bound
# by this install: an operator binds one per namespace, with a RoleBinding,
# where Frame objects need it (docs/deployment.md, "Manager access to
# Secrets"). A ClusterRole is used only so the rules are written once; bound
# by a RoleBinding it grants nothing outside that namespace.
#
# RBAC can't narrow further: Secret names come from user specs
# (credentialsRef, sshKeyRef, joinTokenRef, spec.binding.secretName), a
# create can't be limited by resourceNames, and there is no label selector
# in RBAC. The namespace is the smallest unit left.
#
# reader: FrameMachine BMC credentials; FrameInstall SSH key, join token
# and BMC credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: manager-secret-reader
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
---
# writer: FrameService (its API key Secret, its binding Secret and every
# projectTo copy), and a FrameInstall's kubeconfig when the manager has no
# POD_NAMESPACE. No list/watch (by-name gets, uncached), no patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: manager-secret-writer
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
