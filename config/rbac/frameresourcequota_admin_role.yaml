# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants the full set of verbs over frame.plume-labs.io/frameresourcequotas, enumerated explicitly.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.
#
# It used to be '*', which also covers verbs and subresources that do not
# exist yet — an admin tier that silently acquires whatever a future version
# adds is not a frozen tier, which is the whole point of pinning these to
# the frozen schema.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: frameresourcequota-admin-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - frameresourcequotas
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - frameresourcequotas/status
  verbs:
  - get
