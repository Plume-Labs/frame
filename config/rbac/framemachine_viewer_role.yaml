apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: framemachine-viewer-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framemachines
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framemachines/status
  verbs:
  - get
