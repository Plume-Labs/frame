# This role deliberately carries no rbac.frame.plume-labs.io/tier label.
#
# A FrameCephAction marks an OSD out, restarts it or sets a cluster flag
# such as noout: reversible, but each lowers the data's redundancy or hides
# a failure for a while. Creating or patching one is therefore admin only,
# like a FrameDiskClaim:
#
# Creating a FrameDiskClaim destroys data. Labelling this file would make
# frame-editor aggregate its create and patch verbs, which is a one-request
# promotion from "can edit workloads" to "can wipe a volume". Lot 1 shipped
# exactly that mistake on framemachine_editor_role.yaml -- it had tier: editor
# for one commit, and that was a one-request escalation.
#
# The precedent is frameinstall_editor_role.yaml, unlabelled for the same
# reason (task 7, provisioning/Debian: creating a FrameInstall wipes a
# machine's disks).

# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants edit access to FrameCephAction resources including creation, modification, and
# deletion: everyday Ceph gestures (OSD in/out, restart, scrub, flags for a while),
# without administrative capabilities like bulk deletion.
#
# Bind it deliberately if you want it, to a group, never to a user.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: framecephaction-editor-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framecephactions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framecephactions/status
  verbs:
  - get
