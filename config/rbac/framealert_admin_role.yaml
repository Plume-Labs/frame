# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Read-only, same as framealert_viewer_role.yaml — including for the admin
# tier. A FrameAlert is not a human-authored object: only the alert manager's
# ServiceAccount (bound outside this aggregation, see deploy/kubernetes)
# writes one, by relaying what Alertmanager fired. Granting any tier here
# create/update/patch/delete would let a human forge or erase the cluster's
# alert history — there is no "admin write" for this kind, by design. See
# test/manifests/rbac_tiers_test.go's TestAlertRegistryTiers.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
    rbac.frame.plume-labs.io/tier: admin
  name: framealert-admin-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts/status
  verbs:
  - get
