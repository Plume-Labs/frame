# This role deliberately carries no rbac.frame.plume-labs.io/tier label.
#
# A FrameRelease is the updater's read-only mirror of a signed release manifest. Only the updater writes it, and an admin must not be able to forge a release entry through the console, so no tier aggregates write access to it (the viewer tier reads it).
#
# Same shape as framecephaction_editor_role.yaml and framediskclaim_editor_role.yaml.

# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants edit access to FrameRelease resources including creation, modification and
# deletion, without administrative capabilities like bulk deletion.
#
# Bind it deliberately if you want it, to a group, never to a user.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: framerelease-editor-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framereleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framereleases/status
  verbs:
  - get
