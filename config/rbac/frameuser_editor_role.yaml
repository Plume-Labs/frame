# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the frame.plume-labs.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.
#
# Unlike every other editor tier, this one has **no frameusers/status rule at
# all**: status.passwordHash is an argon2id credential (F11).
#
# The write half of that is real and was measured against a real apiserver:
# this tier's `patch frameusers` cannot alter status.passwordHash. A merge
# patch carrying both a spec change and a status change applies the spec half
# and the apiserver drops the status half silently, so an editor cannot set
# anyone's password. That is the protection moving the hash out of spec
# actually bought — in spec, `patch frameusers` overwrote it.
#
# The read half is not real. A plain `GET frameusers` returns the whole
# object, status included, so this tier can still read the hash: the status
# subresource splits writes, not reads. Granting this role is granting the
# password hashes until the hash moves to a Secret.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: frameuser-editor-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - frameusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
