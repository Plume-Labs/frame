# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to FrameAlert resources — the record of an alert
# the cluster has fired. This is what the Alerts screen reads for everyone;
# no tier below this ever writes a FrameAlert. See framealert_admin_role.yaml
# for why the admin tier is read-only too.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
    rbac.frame.plume-labs.io/tier: viewer
  name: framealert-viewer-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts/status
  verbs:
  - get
