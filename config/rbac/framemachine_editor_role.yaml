# This rule is not used by the project frame itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants edit access to FrameMachine resources including creation, modification, and deletion.
# This role is intended for operators who manage machine configurations and lifecycle
# without administrative capabilities like bulk deletion.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
    rbac.frame.plume-labs.io/tier: editor
  name: framemachine-editor-role
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framemachines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framemachines/status
  verbs:
  - get
