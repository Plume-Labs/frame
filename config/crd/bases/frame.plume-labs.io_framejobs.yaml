---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: framejobs.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: FrameJob
    listKind: FrameJobList
    plural: framejobs
    shortNames:
    - fj
    singular: framejob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.pipeline
      name: Pipeline
      type: string
    - jsonPath: .spec.serviceClass
      name: ServiceClass
      type: string
    - jsonPath: .spec.gpuCount
      name: GPUs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: FrameJob is the Schema for the framejobs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of FrameJob
            properties:
              gpuCount:
                default: 0
                description: Number of GPUs required
                format: int32
                minimum: 0
                type: integer
              namespace:
                default: default
                description: |-
                  Kubernetes namespace for the job. Not required to match this FrameJob's
                  own namespace: the controller creates the backing ArgoWorkflow here
                  with cluster-wide RBAC, so a FrameJob in one namespace can direct
                  workflow creation into another. That cross-namespace reach is
                  deliberate-for-now; constraining it is Phase B's RBAC-tier
                  lock-down to settle, not this validation. This only rejects a
                  malformed value, not a cross-namespace one.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              parameters:
                additionalProperties:
                  type: string
                description: Template parameters for the pipeline
                type: object
              pipeline:
                description: Pipeline template to use (training, inference, batch)
                type: string
              priority:
                description: Priority of the job
                enum:
                - critical
                - high
                - medium
                - low
                type: string
              serviceClass:
                description: Service class for resource allocation
                enum:
                - HIGH
                - MEDIUM
                - LOW
                type: string
              suspended:
                default: false
                description: Suspended pauses the underlying Argo Workflow when true.
                  Set to false to resume.
                type: boolean
            required:
            - pipeline
            type: object
            x-kubernetes-validations:
            - message: jobs requesting GPUs must use serviceClass HIGH or MEDIUM,
                not LOW
              rule: '!has(self.gpuCount) || self.gpuCount == 0 || !has(self.serviceClass)
                || self.serviceClass != ''LOW'''
          status:
            description: status defines the observed state of FrameJob
            properties:
              argoWorkflowName:
                description: ArgoWorkflowName is the name of the created Argo Workflow
                type: string
              completionTime:
                description: CompletionTime is when the job completed
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the FrameJob
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message provides additional information about the current
                  status
                type: string
              phase:
                description: Current phase of the job
                enum:
                - Pending
                - Submitted
                - Running
                - Suspended
                - Completed
                - Failed
                type: string
              startTime:
                description: StartTime is when the job started running
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
