---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: framereleases.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: FrameRelease
    listKind: FrameReleaseList
    plural: framereleases
    shortNames:
    - frel
    singular: framerelease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.channel
      name: Channel
      type: string
    - jsonPath: .status.verified
      name: Verified
      type: boolean
    - jsonPath: .spec.revoked
      name: Revoked
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FrameRelease is a release the updater has seen on a channel.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FrameRelease is one published Hearthrack release as the in-cluster updater
              read it from the release channel (docs/specs/2026-11-24-mise-a-jour-en-un-clic.md,
              §3.1–3.2). It is a read-only mirror: only the updater writes it, and only
              after it verified the signature of the manifest. The console lists these to
              show "version X available"; nothing here is a request to change anything.

              Every image is pinned by digest. A tag can be moved after the fact, a digest
              cannot, which is the whole point of the manifest.
            properties:
              channel:
                description: Channel is the release channel the manifest was published
                  on.
                enum:
                - stable
                - beta
                type: string
              images:
                additionalProperties:
                  type: string
                description: |-
                  Images maps a component (controller, ui, uiproxy, authd, agent,
                  provisiond) to its image reference, which must carry a sha256 digest.
                maxProperties: 16
                minProperties: 1
                type: object
              minFrom:
                description: |-
                  MinFrom is the oldest version an update to this release may start from.
                  Empty means no floor.
                maxLength: 64
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                type: string
              notes:
                description: Notes is the short release note shown before the update.
                maxLength: 4096
                type: string
              publishedAt:
                description: PublishedAt is when the release was published.
                format: date-time
                type: string
              revoked:
                description: |-
                  Revoked marks a release withdrawn by the channel: it is never offered
                  and a pending update to it is refused.
                type: boolean
              rollbackSafeTo:
                description: |-
                  RollbackSafeTo is the oldest version one can return to from this release
                  without losing data. Empty means rollback is not offered.
                maxLength: 64
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                type: string
              version:
                description: Version is the semver without the leading v ("1.0.0",
                  "0.9.0-beta.1").
                maxLength: 64
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                type: string
            required:
            - channel
            - images
            - version
            type: object
          status:
            description: FrameReleaseStatus records what the updater verified.
            properties:
              manifestDigest:
                description: ManifestDigest is the sha256 digest of the signed manifest
                  artifact.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              message:
                description: Message says why verification failed, when it did.
                maxLength: 1024
                type: string
              verified:
                description: |-
                  Verified is true once the manifest signature and every image signature
                  checked out against the pinned identity.
                type: boolean
              verifiedAt:
                description: VerifiedAt is when that check last passed.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
