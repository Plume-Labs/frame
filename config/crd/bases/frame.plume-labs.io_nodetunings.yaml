---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nodetunings.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: NodeTuning
    listKind: NodeTuningList
    plural: nodetunings
    singular: nodetuning
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tunedProfile
      name: TunedProfile
      type: string
    - jsonPath: .spec.ksm.enabled
      name: KSM
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          NodeTuning is the Schema for the nodetunings API. It is cluster-scoped:
          the node-level settings it manages (the tuned profile, KSM, the MIG label)
          have no namespace of their own.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NodeTuning
            properties:
              ksm:
                description: |-
                  KSM configures kernel same-page merging. Nil means untouched, not off:
                  see KSMSpec for why Enabled itself still defaults to false.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  mergeAcrossNodes:
                    type: boolean
                  pagesToScan:
                    format: int32
                    minimum: 1
                    type: integer
                  sleepMillisecs:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - enabled
                type: object
              migProfile:
                description: MIGProfile names the NVIDIA MIG profile to apply.
                type: string
              nodeSelector:
                description: |-
                  NodeSelector picks which nodes this NodeTuning applies to. A nil
                  selector matches no nodes rather than every node, so a NodeTuning
                  created without one is inert instead of fleet-wide by accident.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              tunedProfile:
                description: |-
                  TunedProfile owns sysctls, kernel modules, governor and scheduler. Frame
                  declares which profile runs and never restates its contents: tuned
                  re-applies at boot and on every change, so a second writer has no owner.
                type: string
            type: object
          status:
            description: status defines the observed state of NodeTuning
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodes:
                description: |-
                  Nodes is one entry per node, keyed by name.

                  listType=map is a statement about ownership, not a fix for the write
                  race it looks like it addresses: two components write this list — the
                  controller owns every field except Observed, the node agent owns
                  Observed — and the merge key is what lets a server-side apply from one
                  of them leave the other's entries alone. CRDs do not support strategic
                  merge patch, so a JSON merge patch still replaces the whole array
                  regardless of this marker; that hazard is handled where the writes are
                  (agent.PatchObserved and the reconciler's status patch both take an
                  optimistic lock). What the marker does buy unconditionally is the API
                  server rejecting a duplicate node name, which no writer here could
                  otherwise detect.
                items:
                  description: |-
                    NodeTuningNodeStatus is one node's reconciliation state under a
                    NodeTuning.
                  properties:
                    appliedGeneration:
                      format: int64
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    observed:
                      description: |-
                        ObservedTuning is what the node agent last read back from the node, used
                        to detect drift against NodeTuningSpec.
                      properties:
                        ksm:
                          description: |-
                            ObservedKSM is what the node agent last read back from sysfs about KSM,
                            as opposed to KSMSpec, which is what was asked for.
                          properties:
                            generalProfit:
                              format: int64
                              type: integer
                            memoryKSM:
                              type: boolean
                            pagesSharing:
                              format: int64
                              type: integer
                          required:
                          - generalProfit
                          - memoryKSM
                          - pagesSharing
                          type: object
                        tunedProfile:
                          type: string
                      type: object
                    phase:
                      description: |-
                        NodeTuningPhase is the reconciliation phase for one node under a
                        NodeTuning. It lives per-node in status.nodes, not as a single
                        object-level phase (F2, followed here as in every other Frame type): a
                        fleet applying a change to twenty nodes is not one phase, it is twenty.
                      type: string
                    realization:
                      description: |-
                        Realization is how far a setting has actually taken effect on a node,
                        separate from Phase: a node can be InSync while KSM is only Effective and
                        not yet FullyRealized, because most of KSM's benefit comes from merging
                        pages in containers that were already running when it was turned on.
                      type: string
                    restartedAt:
                      description: |-
                        RestartedAt is when the rollout verified the unit came back. Task 7
                        compares pod start times against it to promote Effective to
                        FullyRealized. It lives in the API rather than being re-derived from the
                        node's ActiveEnterTimestamp, which would cost a second agent round-trip.
                      format: date-time
                      type: string
                    restartedGeneration:
                      description: |-
                        RestartedGeneration is the metadata.generation the restart recorded in
                        RestartedAt was performed for, and it is deliberately not
                        AppliedGeneration: that field is also advanced by a node simply being
                        InSync, so reading "we already restarted for this generation" off it
                        would refuse to ever restart a node that reached this generation
                        without one — for instance a setting that regresses on the node long
                        after an unrelated restart at an older generation.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation this status was computed
                  from.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
