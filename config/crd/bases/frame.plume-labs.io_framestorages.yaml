---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: framestorages.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: FrameStorage
    listKind: FrameStorageList
    plural: framestorages
    shortNames:
    - fstor
    singular: framestorage
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.storageClassName
      name: Class
      type: string
    - jsonPath: .status.shared
      name: Shared
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.capacity.usable
      name: Usable
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FrameStorage is the Schema for the framestorages API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FrameStorageSpec declares one storage entry, in the sense Proxmox VE gives
              the word: a typed, named place where volumes of declared content types can
              live, available on some set of nodes.
            properties:
              adoptExisting:
                description: |-
                  AdoptExisting must be set explicitly for an entry naming a
                  StorageClass Frame did not create. Without it, admission refuses:
                  the cluster's existing classes carry production volumes, and an
                  entry that silently took ownership of one would delete it on its own
                  deletion. An adopted entry owns nothing and deletes nothing.
                type: boolean
              content:
                description: |-
                  Content is what may be stored here — a list, not a single value: a
                  Ceph pool legitimately holds both workload volumes and model
                  artifacts, and forcing a choice would just produce a second entry on
                  the same pool.
                items:
                  enum:
                  - workload
                  - model
                  - backup
                  - artifact
                  - scratch
                  type: string
                maxItems: 5
                minItems: 1
                type: array
              nodes:
                description: |-
                  Nodes empty means every node. A non-empty list names the nodes where
                  this entry is available — the local/shared distinction made concrete.
                items:
                  type: string
                maxItems: 64
                type: array
              storageClassName:
                description: StorageClassName is the StorageClass this entry owns
                  or adopts.
                maxLength: 253
                type: string
              type:
                description: |-
                  Type is what backs this entry. NFS and iSCSI are deliberately out of
                  this lot: neither exists in the park, and a backend nobody runs is a
                  backend nobody tests.
                enum:
                - ceph-rbd
                - ceph-bucket
                - local-path
                type: string
            required:
            - content
            - storageClassName
            - type
            type: object
          status:
            properties:
              adopted:
                description: |-
                  Adopted records that this entry did not create its StorageClass, and
                  therefore must never delete it.
                type: boolean
              capacity:
                description: |-
                  StorageCapacity reports usable space first. Raw is optional and never
                  stands alone: the park's capacity incident came from reading raw numbers
                  on a pool whose replication divides them by three.
                properties:
                  raw:
                    maxLength: 32
                    type: string
                  usable:
                    maxLength: 32
                    type: string
                  used:
                    maxLength: 32
                    type: string
                type: object
              claims:
                description: |-
                  ClaimCounts is the gap between the policy and the cluster: how many PVCs
                  use this entry's class, and how many of them carry the usage label the
                  content-type webhook selects on. A large Total with a zero Labelled is
                  the normal state on the day the webhook lands, and is meant to be read,
                  not fixed automatically.
                properties:
                  labelled:
                    format: int32
                    type: integer
                  total:
                    format: int32
                    type: integer
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - Ready
                - Degraded
                - Unknown
                type: string
              shared:
                description: |-
                  Shared is derived from Type, never declared. ceph-* entries are
                  shared; local-path is not. It lives in status because a user who
                  could write it could declare a local disk shared and have Frame
                  believe it.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
