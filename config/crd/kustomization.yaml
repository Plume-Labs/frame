# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default
resources:
- bases/frame.plume-labs.io_framenodes.yaml
- bases/frame.plume-labs.io_framejobs.yaml
- bases/frame.plume-labs.io_schedulingpolicies.yaml
- bases/frame.plume-labs.io_frameresourcequotas.yaml
- bases/frame.plume-labs.io_talosmachineconfigs.yaml
- bases/frame.plume-labs.io_talosupgrades.yaml
- bases/frame.plume-labs.io_frameusers.yaml
- bases/services.plume-labs.io_frameservices.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
- path: patches/webhook_in_frame_framenodes.yaml
- path: patches/webhook_in_frame_framejobs.yaml
- path: patches/webhook_in_frame_schedulingpolicies.yaml
- path: patches/webhook_in_frame_frameresourcequotas.yaml
- path: patches/webhook_in_frame_talosmachineconfigs.yaml
- path: patches/webhook_in_frame_talosupgrades.yaml
- path: patches/webhook_in_frame_frameusers.yaml
- path: patches/webhook_in_services_frameservices.yaml
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# [WEBHOOK] To enable webhook, uncomment the following section
# the following config is for teaching kustomize how to do kustomization for CRDs.
configurations:
- kustomizeconfig.yaml
