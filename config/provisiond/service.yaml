# frame-provisiond gets two Services on purpose, mirroring its two listeners
# (deployment.yaml). Collapsing them into one Service, even with two ports,
# would put both behind whatever the Service's own exposure is -- and the
# whole design point here is that the build listener (writes a 700 MB file
# from an unauthenticated Spec) and the media listener (read-only, no
# secret) must never share an exposure.
---
# The build API. ClusterIP -- which means reachable by EVERY pod in the
# cluster, not only by the manager. A ClusterIP Service is not an access
# control; it only keeps the endpoint off the LAN, which is the one thing it
# is here to do (the media listener below is the NodePort). On this platform
# "every pod" includes notebooks and coding sandboxes, so this endpoint is
# treated as unauthenticated and reachable by them: it accepts a Spec and
# writes a 700 MB file, and the manager deliberately zeroes Spec.Cluster
# before POSTing so the k3s join token never reaches it
# (internal/provision/server.go, HTTPImageStore.Build).
#
# An earlier version of this comment said "reachable by the manager and
# nothing else", which is false and was the stated reason the token being
# sent here looked acceptable.
#
# Both Service names below are bare, not "frame-provisiond"/
# "frame-provisiond-media": config/default/kustomization.yaml's namePrefix
# ("frame-") adds that prefix at build time, the same as deployment.yaml's
# name. See that file's comment.
apiVersion: v1
kind: Service
metadata:
  name: provisiond
  # Placeholder, not the literal "frame-system" -- see deployment.yaml's
  # comment.
  namespace: system
  labels:
    app.kubernetes.io/name: frame-provisiond
    app.kubernetes.io/part-of: frame
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frame-provisiond
  ports:
    - name: build
      port: 8080
      targetPort: build
      protocol: TCP
---
# The media listener. This is the one the BMC reaches, so it is the one
# exposed on the machine network -- and it carries no secret, because no
# secret ever enters an installer image. It is not read-only: it may
# deposit an installation's progress (the beacon route), and it may never
# disclose one -- see internal/provision/server.go's MediaHandler doc
# comment, which this mirrors.
apiVersion: v1
kind: Service
metadata:
  name: provisiond-media
  # Placeholder, not the literal "frame-system" -- see deployment.yaml's
  # comment.
  namespace: system
  labels:
    app.kubernetes.io/name: frame-provisiond
    app.kubernetes.io/part-of: frame
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frame-provisiond
  ports:
    - name: media
      port: 8081
      targetPort: media
      nodePort: 30581
      protocol: TCP
