apiVersion: frame.plume-labs.io/v1beta1
kind: TalosMachineConfig
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: worker-01-patch
  namespace: frame-system
spec:
  nodeName: worker-01
  talosEndpoint: "192.168.10.10:50000"
  # Read from this CR's own namespace. v1alpha1 had a talosSecretRef.namespace
  # naming another one; it is gone (F6).
  talosSecretRef:
    name: talos-client-certs
  configPatch: |
    machine:
      sysctls:
        vm.max_map_count: "524288"
      kubelet:
        extraArgs:
          max-pods: "250"
