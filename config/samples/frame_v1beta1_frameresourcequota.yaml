apiVersion: frame.plume-labs.io/v1beta1
kind: FrameResourceQuota
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: frameresourcequota-sample
  namespace: frame-system
spec:
  # Projected as a ResourceQuota named frame-high into every namespace
  # labelled frame.plume-labs.io/service-class=HIGH.
  serviceClass: HIGH
  maxGPUs: 8
  maxCPU: "256"
  maxMemory: 1Ti
  # Counts FrameJob objects, not the pods their workflows fan out to.
  maxJobs: 20
