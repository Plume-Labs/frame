apiVersion: services.plume-labs.io/v1beta1
kind: FrameService
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: frameservice-sample
  namespace: frame-system
spec:
  # Selects the inference provider. The set of valid types is closed and
  # enforced by the webhook against the provider registry.
  type: inference

  # Provider-owned and validated at admission against that provider's schema,
  # not this CRD's OpenAPI. There is no `plan` field: size is derived, not
  # chosen. The inference provider reads `model` and `contextLength` and
  # computes the GPU memory floor itself (weights + KV cache), publishing the
  # result in status.sizing — see "Sizing" in the design spec.
  #
  # This pairing fits the cluster's only GPU, a Tesla P4 (7680Mi): Llama 3.1
  # 8B Instruct at Q4_K_M is 4696Mi of weights, and 8192 tokens of KV cache
  # add another 1024Mi, for 5720Mi total. Raising contextLength to 32768 would
  # ask for 8792Mi and be refused at admission rather than left Pending.
  parameters:
    model: llama-3.1-8b-instruct
    contextLength: "8192"

  # Which service class this instance's workloads run under, so the existing
  # FrameResourceQuota and SchedulingPolicy apply to it like any other
  # workload. It says what tier the instance runs at, never which node —
  # Frame's scheduler decides placement, this spec cannot name one.
  serviceClass: HIGH

  binding:
    # Empty: the credentials Secret stays in this namespace under the
    # FrameService's own name. List other namespaces here to have the
    # controller project a copy into each of them.
    projectTo: []

  # Retain (default): deleting this FrameService removes the Service and
  # credentials Secret it exposed, but leaves the model-cache PVC behind.
  # Delete would remove that too.
  deletionPolicy: Retain
