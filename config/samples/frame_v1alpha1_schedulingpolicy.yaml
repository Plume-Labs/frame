apiVersion: frame.plume-labs.io/v1alpha1
kind: SchedulingPolicy
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: schedulingpolicy-sample
  namespace: frame-system
spec:
  scheduler: volcano
  # Reconciled into a real PriorityClass of this name and value.
  priorityClass: frame-high
  priorityValue: 100000
  # Reconciled into a Volcano queue. If the Volcano CRDs are absent the
  # controller degrades: it warns and still applies the PriorityClass.
  queueName: research
  queueWeight: 4
  gangScheduling: true
  preemption: true
