apiVersion: frame.plume-labs.io/v1alpha1
kind: FrameJob
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: framejob-sample
  namespace: frame-system
spec:
  name: resnet-train
  pipeline: training
  # The namespace the Argo Workflow is created in, which need not be the
  # namespace holding this FrameJob.
  namespace: default
  serviceClass: HIGH
  priority: high
  gpuCount: 2
  parameters:
    dataset: imagenet
    epochs: "90"
  # Flip to true to suspend the underlying Workflow, back to false to resume.
  suspended: false
