apiVersion: frame.plume-labs.io/v1beta1
kind: FrameNode
metadata:
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
  name: worker-01
  namespace: frame-system
spec:
  # A FrameNode classifies a Kubernetes node: the controller projects role,
  # rack, zone and service class onto the node named by hostname (or by this
  # object's name). ip is the only required field.
  ip: 192.168.10.10
  role: worker
  hostname: worker-01
  rack: rack-a
  zone: zone-1
  serviceClass: HIGH
  rdmaInterface: ib0
  network:
    address: 192.168.10.10/24
    gateway: 192.168.10.1
    dns:
      - 1.1.1.1
