# The recommended install: config/default plus the namespaces where the
# manager may use Secrets. config/default grants it nothing on Secrets
# outside its own namespace (docs/deployment.md, "Manager access to
# Secrets"); every namespace holding a FrameMachine, FrameInstall or
# FrameService must be bound here, or its objects fail with Forbidden.
#
# Deploy:  make deploy-production IMG=<registry>/frame-controller:<tag> \
#            IMG_PROVISIOND=<registry>/frame-provisiond:<tag>
#          (renders a mktemp copy with the images set: never `kubectl apply -k`
#          here directly — the controller image would be config/manager's
#          placeholder, example.com/frame:v0.0.1, and never pull)
# Adapt:   edit secret-access.yaml — one RoleBinding per namespace, to
#          frame-manager-secret-reader (FrameMachine, FrameInstall) or
#          frame-manager-secret-writer (FrameService and each projectTo
#          namespace). test/managerrbac renders this overlay and checks it.
#
# No `namespace:` or `namePrefix:` here: config/default's apply to its own
# resources only, and these bindings name their namespaces and the
# prefixed roles explicitly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../default
- secret-access.yaml
# frame-provisiond is included (from config/default): it assembles installer
# images for FrameInstall and serves them to a BMC from its media listener.
# That listener's Service, frame-provisiond-media, is ClusterIP: closed to
# the machine network until you open it. Before running a FrameInstall:
#   1. expose it -- uncomment the patch below and pick the port, or front it
#      with a LoadBalancer -- and restrict it to the BMCs' network
#      (NetworkPolicy or the nodes' firewall);
#   2. set the manager's --provisiond-media-url and provisiond's MEDIA_URL
#      to the address the BMCs reach it at (docs/deployment.md, "Exposing
#      the media listener" and "Provisioning a machine with Ubuntu").
# Until then FrameInstall fails at once with the placeholder URL named.
#
# Exposing the media listener on a NodePort (pick a port free on your
# management network; 30581 was the old fixed default and collides with any
# other cluster still using it). externalTrafficPolicy: Local keeps the
# BMC's source address for a NetworkPolicy to filter on, and answers only on
# the node running frame-provisiond, so the media URL must name that node;
# drop it to answer on every node:
#
# patches:
# - target: {kind: Service, name: frame-provisiond-media}
#   patch: |
#     - op: replace
#       path: /spec/type
#       value: NodePort
#     - op: add
#       path: /spec/externalTrafficPolicy
#       value: Local
#     - op: add
#       path: /spec/ports/0/nodePort
#       value: 30581   # yours: a port free on the management network
#
# Optional — a cluster that will never provision a machine can leave
# frame-provisiond out rather than run it unused. Uncomment these patches
# instead of the one above; the render then carries no provisiond image, so
# any IMG_PROVISIOND satisfies `make deploy-production` (e.g.
# IMG_PROVISIOND=unused.invalid/frame-provisiond:none):
#
# patches:
# - target: {kind: Deployment, name: frame-provisiond}
#   patch: |
#     $patch: delete
#     apiVersion: apps/v1
#     kind: Deployment
#     metadata:
#       name: frame-provisiond
# - target: {kind: Service, name: frame-provisiond}
#   patch: |
#     $patch: delete
#     apiVersion: v1
#     kind: Service
#     metadata:
#       name: frame-provisiond
# - target: {kind: Service, name: frame-provisiond-media}
#   patch: |
#     $patch: delete
#     apiVersion: v1
#     kind: Service
#     metadata:
#       name: frame-provisiond-media
