# FrameMachine default/ml350-g9: BMC credentials (credentialsRef).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frame-manager-secret-reader
  namespace: default
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frame-manager-secret-reader
subjects:
- kind: ServiceAccount
  name: frame-controller-manager
  namespace: frame-system
#
# No FrameService exists on this cluster (inference/llama-8b, a catalogue
# test fixture never provisioned, was deleted on 2026-09-28), so nothing is
# bound to frame-manager-secret-writer. When one is declared, add a
# RoleBinding to it in the FrameService's namespace and in each of its
# spec.binding.projectTo namespaces (docs/deployment.md, "Manager access to
# Secrets"), and add the namespace to test/managerrbac's expected list.
