# FrameMachine default/ml350-g9: BMC credentials (credentialsRef).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frame-manager-secret-reader
  namespace: default
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frame-manager-secret-reader
subjects:
- kind: ServiceAccount
  name: frame-controller-manager
  namespace: frame-system
---
# FrameService inference/llama-8b: its API key Secret and binding Secret
# (no projectTo today; add a writer binding per projectTo namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frame-manager-secret-writer
  namespace: inference
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frame-manager-secret-writer
subjects:
- kind: ServiceAccount
  name: frame-controller-manager
  namespace: frame-system
