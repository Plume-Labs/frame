# Namespace default: where config/samples and docs/deployment.md put their
# FrameMachine (BMC credentials, credentialsRef) and FrameInstall (sshKeyRef,
# joinTokenRef). Keep, replace or add one such RoleBinding per namespace
# that holds those objects on your cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frame-manager-secret-reader
  namespace: default
  labels:
    app.kubernetes.io/name: frame
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frame-manager-secret-reader
subjects:
- kind: ServiceAccount
  name: frame-controller-manager
  namespace: frame-system
#
# Nothing is bound to frame-manager-secret-writer by default: which
# namespaces hold FrameServices is yours to say. For each FrameService, add
# a RoleBinding to it in the FrameService's namespace and in each of its
# spec.binding.projectTo namespaces (docs/deployment.md, "Manager access to
# Secrets"), and add the namespace to test/managerrbac's expected list.
