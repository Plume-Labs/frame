apiVersion: v2
name: frame
description: |
  Frame Kubernetes platform operator: node classification, hardware over
  Redfish, Debian provisioning, workload scheduling, resource quotas, and
  service provisioning, driven by CRDs with validating/defaulting webhooks. Packages the operator only — the React
  control-plane UI and authd are out of scope for this chart.
type: application
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/Plume-Labs/frame
sources:
  - https://github.com/Plume-Labs/frame
keywords:
  - frame
  - kubebuilder
  - operator
  - kubernetes
maintainers:
  - name: Frame maintainers
