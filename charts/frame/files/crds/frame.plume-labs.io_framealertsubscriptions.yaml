---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: framealertsubscriptions.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: FrameAlertSubscription
    listKind: FrameAlertSubscriptionList
    plural: framealertsubscriptions
    singular: framealertsubscription
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.pendingDeliveries
      name: Pending
      type: integer
    - jsonPath: .status.lastSuccessAt
      name: LastSuccess
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FrameAlertSubscription declares a tenant endpoint that receives
          cluster alerts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              filter:
                default: {}
                description: |-
                  AlertFilter decides which alerts a subscription receives. Empty lists
                  mean "no restriction", except excludeAlertNames which defaults to the two
                  meta alerts that never resolve.
                properties:
                  excludeAlertNames:
                    default:
                    - Watchdog
                    - InfoInhibitor
                    items:
                      type: string
                    type: array
                  namespaces:
                    items:
                      type: string
                    type: array
                  severities:
                    items:
                      type: string
                    type: array
                type: object
              paused:
                type: boolean
              tokenSecretRef:
                description: |-
                  AlertTokenRef names a Secret key in the subscription's own namespace. The
                  relay only reads Secrets carrying the label
                  frame.plume-labs.io/alert-token: "true"; anything else is a permanent
                  delivery failure and is never sent. This stops a subscription (writable by
                  a frame-admin, who has no Secret access) from pointing tokenSecretRef at
                  an arbitrary Secret and exfiltrating its value to the subscription's URL.
                properties:
                  key:
                    maxLength: 253
                    type: string
                  name:
                    description: |-
                      The Secret must carry the label frame.plume-labs.io/alert-token: "true",
                      otherwise the relay treats it as a permanent misconfiguration and does
                      not send.
                    maxLength: 253
                    type: string
                required:
                - key
                - name
                type: object
              url:
                maxLength: 2048
                pattern: ^https?://.+
                type: string
            required:
            - tokenSecretRef
            - url
            type: object
          status:
            properties:
              computedAt:
                description: When the status was last computed; bounds recomputation
                  to once a minute.
                format: date-time
                type: string
              lastError:
                maxLength: 1024
                type: string
              lastSuccessAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              pendingDeliveries:
                description: |-
                  A merge patch to 0 must still send the field explicitly: omitempty
                  would drop it, and the rollout proof reads pendingDeliveries: 0.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
