---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: framealerts.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: FrameAlert
    listKind: FrameAlertList
    plural: framealerts
    singular: framealert
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.alertName
      name: Alert
      type: string
    - jsonPath: .spec.severity
      name: Severity
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FrameAlert is one cluster alert as Frame received it, with its
          relay record.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FrameAlertSpec is what Alertmanager said about one alert, written by the
              receiver alone. The object is named fa-<fingerprint>: Alertmanager's
              fingerprint is a stable hash of the labels, so one object carries the alert
              from firing to resolution without an index.
            properties:
              alertName:
                maxLength: 256
                type: string
              annotations:
                additionalProperties:
                  type: string
                maxProperties: 64
                type: object
              endsAt:
                description: Empty while the alert fires.
                format: date-time
                type: string
              fingerprint:
                pattern: ^[0-9a-f]{1,64}$
                type: string
              generatorURL:
                maxLength: 2048
                type: string
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Bounded by the receiver (64 entries, 256-byte keys, 4096-byte values)
                  before it ever reaches the apiserver.
                maxProperties: 64
                type: object
              namespace:
                maxLength: 63
                type: string
              severity:
                maxLength: 64
                type: string
              startsAt:
                format: date-time
                type: string
            required:
            - fingerprint
            - startsAt
            type: object
          status:
            description: |-
              FrameAlertStatus: state and lastReceivedAt belong to the receiver,
              deliveries to the relay. Each writes with a merge patch holding only its
              own fields.
            properties:
              deliveries:
                items:
                  description: AlertDelivery is the relay's record of one subscription
                    for one alert.
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    deliveredState:
                      description: The last state delivered successfully; empty until
                        the first success.
                      enum:
                      - Firing
                      - Resolved
                      type: string
                    excluded:
                      description: |-
                        True when this entry was recorded without ever sending anything,
                        because the subscription's filter did not match the alert at the
                        time it resolved. Spec §5.3: a filter that widens afterwards must not
                        replay the incident to a tenant who never had it open. Never set on
                        an entry that was genuinely delivered (deliveredState reached by an
                        actual send survives a filter that stops matching afterwards).
                        Cleared back to false the next time a delivery actually succeeds.
                      type: boolean
                    failedState:
                      description: The alert state the permanent failure was recorded
                        against.
                      type: string
                    lastAttemptAt:
                      format: date-time
                      type: string
                    lastDeliveredAt:
                      format: date-time
                      type: string
                    lastError:
                      maxLength: 1024
                      type: string
                    permanentFailure:
                      description: |-
                        A non-retryable answer (401, 400, a redirect). Lifted when the alert
                        changes state or the subscription's generation changes.
                      type: boolean
                    subscription:
                      type: string
                    subscriptionGeneration:
                      description: The subscription generation this entry was last
                        evaluated against.
                      format: int64
                      type: integer
                  required:
                  - subscription
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - subscription
                x-kubernetes-list-type: map
              lastReceivedAt:
                description: |-
                  Rewritten at most every 15 minutes: Alertmanager resends unchanged
                  groups every few minutes, and kine on the test cluster cannot absorb
                  a write per resend.
                format: date-time
                type: string
              state:
                enum:
                - Firing
                - Resolved
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
