---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: talosupgrades.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: TalosUpgrade
    listKind: TalosUpgradeList
    plural: talosupgrades
    singular: talosupgrade
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: NodeName
      type: string
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosUpgrade is the Schema for the talosupgrades API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TalosUpgrade
            properties:
              image:
                description: Image is the Talos installer image to upgrade to (e.g.
                  ghcr.io/siderolabs/installer:v1.8.0).
                maxLength: 255
                type: string
                x-kubernetes-validations:
                - message: image must include a tag (e.g. installer:v1.8.0)
                  rule: self.split('/')[self.split('/').size()-1].contains(':')
              nodeName:
                description: NodeName is the Kubernetes node name to upgrade.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              talosEndpoint:
                description: |-
                  TalosEndpoint is the Talos API endpoint (host:port) for this node.
                  The bracketed form (e.g. [fd00::1]:50000) is accepted for IPv6, same
                  as net.SplitHostPort in the webhook check this mirrors.
                pattern: ^(\[[0-9a-fA-F:]+\]|[a-zA-Z0-9.-]+):[0-9]+$
                type: string
              talosSecretRef:
                description: |-
                  TalosSecretRef references the Secret containing Talos client certificates
                  (keys: ca.crt, client.crt, client.key).
                properties:
                  name:
                    description: |-
                      Name of the referenced Secret. Optional to match corev1.SecretReference,
                      which this type mirrors -- making it Required here would be a new
                      constraint arriving unremarked. Whether it should be required is
                      Phase B's to decide deliberately.
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referenced Secret. Empty means "this CR's own
                      namespace" -- buildTalosClient falls back to it explicitly -- so the
                      pattern accepts empty alongside a well-formed label. May reference a
                      namespace other than this CR's own: the controller's Secret RBAC is
                      cluster-wide, so that reach is deliberately unconstrained today --
                      Phase B's RBAC-tier lock-down is where it gets settled, not here.
                      This only rejects a malformed value, not a cross-namespace one.
                    maxLength: 63
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - image
            - nodeName
            - talosEndpoint
            - talosSecretRef
            type: object
          status:
            description: status defines the observed state of TalosUpgrade
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the TalosUpgrade resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation this status was computed
                  from. A client can compare it to metadata.generation to tell whether
                  the controller has seen the current spec yet, without knowing anything
                  about this kind's condition vocabulary.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
