---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: frameupdates.frame.plume-labs.io
spec:
  group: frame.plume-labs.io
  names:
    kind: FrameUpdate
    listKind: FrameUpdateList
    plural: frameupdates
    shortNames:
    - fupd
    singular: frameupdate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetVersion
      name: Target
      type: string
    - jsonPath: .spec.rollback
      name: Rollback
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.step
      name: Step
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: FrameUpdate is a request to update, or roll back, Hearthrack
          itself.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FrameUpdateSpec is a request to move Hearthrack to another version, or to
              go back to the previous one. It is the only surface the console touches to
              update anything (docs/specs/2026-11-24-mise-a-jour-en-un-clic.md §3.3): the
              console never patches a Deployment or an image itself.

              The request is a gesture, fixed at creation. Changing the target of an
              update already running would make "what was asked" unreadable afterwards.

              There is deliberately no field to skip signature verification. Force only
              lifts the "something is in flight" check; a signature failure is final.
            properties:
              force:
                description: |-
                  Force proceeds although jobs, installs or components are not at rest. It
                  never overrides a signature check, and never overrides an OSD
                  replacement in progress.
                type: boolean
              rollback:
                description: |-
                  Rollback asks to return to the version this install ran before its last
                  successful update, when that release says it is safe.
                type: boolean
              targetVersion:
                description: TargetVersion is the FrameRelease version to move to.
                maxLength: 64
                pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
                type: string
            type: object
            x-kubernetes-validations:
            - message: an update request is fixed at creation
              rule: self == oldSelf
            - message: set targetVersion, or rollback, not both and not neither
              rule: '(has(self.rollback) && self.rollback) ? !has(self.targetVersion)
                : has(self.targetVersion)'
          status:
            description: FrameUpdateStatus is written by the updater, never by the
              console.
            properties:
              components:
                description: Components lists each component and where it stands,
                  in apply order.
                items:
                  description: UpdateComponentStatus is one component's progress through
                    an update.
                  properties:
                    from:
                      description: From and To are image references pinned by digest.
                      type: string
                    name:
                      maxLength: 63
                      type: string
                    state:
                      enum:
                      - Pending
                      - Applying
                      - Ready
                      - RolledBack
                      - Failed
                      type: string
                    to:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              finishedAt:
                format: date-time
                type: string
              fromVersion:
                description: |-
                  FromVersion is the version running when the update began. It is what a
                  later rollback returns to.
                type: string
              message:
                description: Message says why an update was refused, failed or rolled
                  back.
                maxLength: 1024
                type: string
              phase:
                enum:
                - Pending
                - Verifying
                - Applying
                - Succeeded
                - RollingBack
                - RolledBack
                - Refused
                - Failed
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the Kubernetes user the request was impersonated as, copied
                  by the updater for the journal.
                maxLength: 254
                type: string
              startedAt:
                format: date-time
                type: string
              step:
                description: Step is the human-readable step in progress ("Applying
                  uiproxy").
                maxLength: 200
                type: string
              updater:
                description: Updater is the updater's own update, applied by the operator.
                properties:
                  from:
                    description: From is the image the updater ran before; written
                      by the operator.
                    maxLength: 512
                    type: string
                  message:
                    maxLength: 1024
                    type: string
                  since:
                    description: Since is when the operator started applying To.
                    format: date-time
                    type: string
                  state:
                    enum:
                    - Pending
                    - Applying
                    - Ready
                    - RolledBack
                    - Failed
                    type: string
                  to:
                    description: |-
                      To is the updater image the release names, pinned by digest. Written by
                      the updater.
                    maxLength: 512
                    type: string
                required:
                - to
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
