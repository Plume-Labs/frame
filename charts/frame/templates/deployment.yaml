apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frame.name" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "frame.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "frame.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: "{{ required "image.repository is required: set it to wherever you pushed the operator image built from Dockerfile.controller (NOT the root Dockerfile, which is the UI) — there is no default published image yet, so leaving this unset would otherwise install cleanly and then sit in ImagePullBackOff." .Values.image.repository }}:{{ include "frame.imageTag" . }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        {{- if .Values.metrics.enabled }}
        - --metrics-bind-address=:{{ include "frame.metricsPort" . }}
        {{- end }}
        - --leader-elect
        - --health-probe-bind-address=:8081
        {{- if not .Values.metrics.secure }}
        - --metrics-secure=false
        {{- end }}
        # The in-cluster build API. frame.name is a fixed literal, not
        # release-scoped (_helpers.tpl), so provisiond.build.url is empty by
        # default and this falls back to the address provisiond-service.yaml
        # always publishes; set the value only to reach a provisiond outside
        # this release.
        - --provisiond-build-url={{ .Values.provisiond.build.url | default (printf "http://%s-provisiond:8080" (include "frame.name" .)) }}
        # Required, not defaulted -- but only when provisiond is enabled.
        # There is no address this chart could pick that is guaranteed
        # reachable from a management network it knows nothing about, so a
        # cluster that provisions machines must say. A cluster that does not
        # run provisiond has nothing to say and must still be able to
        # upgrade: unconditional `required` here made a value only the
        # FrameInstall controller uses block every release of this chart.
        # With it unset, the manager starts and FrameInstall reconciliation
        # refuses (internal/controller/frame/frameinstall_controller.go),
        # which is where the missing setting is actually noticed.
        {{- if .Values.provisiond.enabled }}
        - --provisiond-media-url={{ required "provisiond.media.url is required when provisiond.enabled is true: the base URL a machine's BMC (on the management network, not the pod network) can reach frame-provisiond's NodePort media listener at, e.g. http://192.168.2.10:30581. Set provisiond.enabled=false if this cluster will never provision a machine." .Values.provisiond.media.url }}
        {{- end }}
        - --alert-receiver-bind-address=:8445
        {{- if .Values.webhooks.enabled }}
        - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
        {{- end }}
        env:
        # POD_NAMESPACE is how the FrameInstall controller learns the
        # operator's own namespace for the kubeconfig Secret a cluster-init
        # install produces (Reconciler.OperatorNamespace) -- there is no
        # other portable way for the process to learn it. Always present,
        # unlike ENABLE_WEBHOOKS below, which is conditional.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if not .Values.webhooks.enabled }}
        # cmd/main.go only skips webhook *registration* when this is exactly
        # "false" (it checks os.Getenv, not this chart's flag) — dropping just
        # the cert mount/volume/port below still leaves the manager trying to
        # register all 10 webhooks and crash-looping on the now-missing
        # tls.crt (C-1). This is the actual switch that turns them off.
        - name: ENABLE_WEBHOOKS
          value: "false"
        {{- end }}
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 8445
          name: alert-receiver
          protocol: TCP
        {{- if .Values.webhooks.enabled }}
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        {{- end }}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.webhooks.enabled }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
        {{- else }}
        volumeMounts: []
        {{- end }}
      {{- if .Values.webhooks.enabled }}
      volumes:
      - name: webhook-certs
        secret:
          secretName: {{ .Values.webhooks.certSecretName }}
      {{- else }}
      volumes: []
      {{- end }}
      serviceAccountName: {{ include "frame.name" . }}-controller-manager
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if .Values.podAntiAffinity.enabled }}
      # Soft (preferred) anti-affinity built from frame.selectorLabels — the
      # same helper the Deployment's own selector and every Service/
      # NetworkPolicy/ServiceMonitor selector use (N-4: values.yaml can't call
      # a template helper, so a hand-written copy of these two labels there
      # would silently stop matching if the helper ever changed). Disable via
      # podAntiAffinity.enabled: false, or replace entirely by setting
      # .Values.affinity.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  {{- include "frame.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
