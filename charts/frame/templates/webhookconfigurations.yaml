{{- if .Values.webhooks.enabled }}
{{- if and (not .Values.certManager.enabled) (not .Values.webhooks.caBundle) }}
{{ fail "certManager.enabled is false and webhooks.caBundle is empty: every FrameJob/FrameNode/FrameService/... create and update would fail cluster-wide with an x509 error the moment the manager comes up (failurePolicy: Fail on all 10 webhooks), because the API server has no CA to trust the manager's serving cert. Set webhooks.caBundle to the base64 PEM CA bundle that signed webhooks.certSecretName's certificate — see charts/frame/README.md, \"Installing without cert-manager\" — or leave certManager.enabled: true." }}
{{- end }}
{{- $svc := printf "%s-webhook-service" (include "frame.name" .) }}
{{- $ns := .Release.Namespace }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "frame.name" . }}-mutating-webhook-configuration
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ $ns }}/{{ include "frame.name" . }}-serving-cert
  {{- end }}
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    {{- if not .Values.certManager.enabled }}
    caBundle: {{ .Values.webhooks.caBundle | quote }}
    {{- end }}
    service:
      name: {{ $svc }}
      namespace: {{ $ns }}
      path: /mutate-frame-plume-labs-io-v1beta1-framejob
  failurePolicy: Fail
  name: mframejob-v1beta1.kb.io
  rules:
  - apiGroups:
    - frame.plume-labs.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - framejobs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    {{- if not .Values.certManager.enabled }}
    caBundle: {{ .Values.webhooks.caBundle | quote }}
    {{- end }}
    service:
      name: {{ $svc }}
      namespace: {{ $ns }}
      path: /mutate-frame-plume-labs-io-v1beta1-framenode
  failurePolicy: Fail
  name: mframenode-v1beta1.kb.io
  rules:
  - apiGroups:
    - frame.plume-labs.io
    apiVersions:
    - v1beta1
    operations:
    - CREATE
    - UPDATE
    resources:
    - framenodes
  sideEffects: None
