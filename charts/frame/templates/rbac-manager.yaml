apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "frame.name" . }}-manager-role
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - resourcequotas
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# frameservice_controller.go reaches every Secret it touches by name and
# deliberately holds no list/watch (see its marker comment) — enumeration
# would mean the right to read every Secret in the cluster, and it isn't
# needed for a get-by-name. No patch either: every write there goes through
# CreateOrUpdate or Delete, never Patch.
#
# list and watch are granted anyway (lot 1, hardware/Redfish): the
# FrameMachine controller reads a machine's BMC credentials from a Secret and
# needs to react when that Secret changes, which needs an informer — see
# framemachine_controller.go's own marker
# (groups="",resources=secrets,verbs=get;list;watch). controller-gen unions
# both controllers' markers into this one rule, so the verb set here is the
# two controllers' needs combined, not either one's alone.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framejobs
  - framenodes
  - frameresourcequotas
  - nodetunings
  - schedulingpolicies
  - talosmachineconfigs
  - talosupgrades
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framejobs/finalizers
  - framemachines/finalizers
  - framenodes/finalizers
  - frameresourcequotas/finalizers
  - nodetunings/finalizers
  - schedulingpolicies/finalizers
  - talosmachineconfigs/finalizers
  - talosupgrades/finalizers
  verbs:
  - update
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framejobs/status
  - framemachines/status
  - framenodes/status
  - frameresourcequotas/status
  - nodetunings/status
  - schedulingpolicies/status
  - talosmachineconfigs/status
  - talosupgrades/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framemachines
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - frameusers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduling.volcano.sh
  - yunikorn.apache.org
  resources:
  - queues
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - services.plume-labs.io
  resources:
  - frameservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - services.plume-labs.io
  resources:
  - frameservices/finalizers
  verbs:
  - update
- apiGroups:
  - services.plume-labs.io
  resources:
  - frameservices/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "frame.name" . }}-manager-rolebinding
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "frame.name" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "frame.name" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
