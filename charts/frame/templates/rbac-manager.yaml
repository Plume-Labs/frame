# The `rules:` blocks below must stay in the same order
# config/rbac/role.yaml (controller-gen's generated output) has them in.
# hack/helm-parity.sh's content diff runs both sides through `jq -S`, which
# sorts object keys but does not touch array order -- so two `rules` arrays
# with identical content in a different block order still fail the diff,
# and the failure prints as resources appearing only on one side even
# though they are plainly present on both. If `make helm-parity` reports a
# missing/extra resource here that you can see is actually in both files,
# check the block order against config/rbac/role.yaml before assuming a
# rule is missing.
#
# controller-gen's own block order is not stable across unrelated changes:
# adding an RBAC marker anywhere in the repo can shift where an existing
# resource lands in config/rbac/role.yaml's rules array, which means this
# file's order can need reshuffling again even when nothing here changed.
# Canonicalising array order in the parity script's comparison (sorting
# each rules array before diffing, the same way jq -S already sorts object
# keys) would remove the need for this note and the reordering it asks
# for, but that is a fix to hack/helm-parity.sh's own comparison logic, not
# to this chart, and was left for whoever next has reason to touch that
# script.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "frame.name" . }}-manager-role
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  - persistentvolumeclaims
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - resourcequotas
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# frameservice_controller.go reaches every Secret it touches by name and
# deliberately holds no list/watch (see its marker comment) — enumeration
# would mean the right to read every Secret in the cluster, and it isn't
# needed for a get-by-name. No patch either: every write there goes through
# CreateOrUpdate or Delete, never Patch.
#
# The FrameMachine controller (lot 1, hardware/Redfish) also reads a
# Secret — a machine's BMC credentials, by name — and holds only `get` on it
# (framemachine_controller.go's own marker,
# groups="",resources=secrets,verbs=get): it has no Watches/Owns on Secrets
# in its SetupWithManager, and cmd/main.go's Cache.DisableFor(corev1.Secret{})
# means the lookup is always an uncached, by-name GET, never an informer.
# `list`/`watch` were granted here for a release before this comment was
# corrected, on the belief that reacting to a credential change needed an
# informer; it didn't, and the whole-branch review that caught it is why
# they are gone — enumeration means the right to read every Secret in the
# namespace, which no console tier is meant to have. controller-gen unions
# every controller's marker into this one rule, so the verb set here is
# every controller's needs combined, not any one's alone; today that union
# is exactly frameservice_controller.go's, since every Secret-reading
# controller besides it holds `get` alone.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - workflows
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ceph.rook.io
  resources:
  - cephblockpools
  - cephclusters
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framediskclaims
  - frameinstalls
  - framemachines
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framediskclaims/finalizers
  - frameinstalls/finalizers
  - framejobs/finalizers
  - framemachines/finalizers
  - framenodes/finalizers
  - frameresourcequotas/finalizers
  - framestorages/finalizers
  - nodetunings/finalizers
  - schedulingpolicies/finalizers
  - talosmachineconfigs/finalizers
  - talosupgrades/finalizers
  verbs:
  - update
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framediskclaims/status
  - frameinstalls/status
  - framejobs/status
  - framemachines/status
  - framenodes/status
  - frameresourcequotas/status
  - framestorages/status
  - frametasks/status
  - nodetunings/status
  - schedulingpolicies/status
  - talosmachineconfigs/status
  - talosupgrades/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framejobs
  - framenodes
  - frameresourcequotas
  - nodetunings
  - schedulingpolicies
  - talosmachineconfigs
  - talosupgrades
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The controller creates a FrameStorage entry's StorageClass and may adopt an
# existing one (see storageclasses below), but never deletes either -- an
# entry describes where volumes may live, and removing the description must
# never remove the volumes. No delete verb here, unlike every other
# frame.plume-labs.io resource in this file.
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framestorages
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
# FrameInstallReconciler writes exactly one FrameTask per creation and one
# per terminal phase (frameinstall_controller.go's recordTask) -- an audit
# trail this manager never reads back, so create is the only verb on the
# collection itself; frametasks/status above still needs get/patch/update to
# set each entry's own outcome after creating it.
- apiGroups:
  - frame.plume-labs.io
  resources:
  - frametasks
  verbs:
  - create
- apiGroups:
  - frame.plume-labs.io
  resources:
  - frameusers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.k8s.io
  resources:
  - priorityclasses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduling.volcano.sh
  - yunikorn.apache.org
  resources:
  - queues
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - services.plume-labs.io
  resources:
  - frameservices
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - services.plume-labs.io
  resources:
  - frameservices/finalizers
  verbs:
  - update
- apiGroups:
  - services.plume-labs.io
  resources:
  - frameservices/status
  verbs:
  - get
  - patch
  - update
# The FrameStorage admission webhook and controller both read a
# StorageClass by name to decide whether an entry is adopting one that
# already exists; the controller additionally creates the class for an
# entry that owns one. No delete here either, for the same reason as
# framestorages above.
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - create
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "frame.name" . }}-manager-rolebinding
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "frame.name" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "frame.name" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
