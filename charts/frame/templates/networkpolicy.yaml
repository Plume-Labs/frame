{{- if .Values.networkPolicy.enabled }}
{{- if .Values.metrics.enabled }}
# Allows ingress to the metrics endpoint only from namespaces labeled
# `metrics: enabled`. Mirrors config/network-policy/allow-metrics-traffic.yaml,
# which kustomize has commented out of config/default (same off-by-default
# posture this chart takes via networkPolicy.enabled: false).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frame.name" . }}-allow-metrics-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frame.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled
      ports:
        - port: {{ include "frame.metricsPort" . }}
          protocol: TCP
{{- end }}
{{- if .Values.webhooks.enabled }}
---
# Allows ingress to the webhook server only from namespaces labeled
# `webhook: enabled`. Loosely mirrors
# config/network-policy/allow-webhook-traffic.yaml, with one deliberate fix
# (I-3): NetworkPolicy ingress ports are *pod* ports, not Service ports. The
# webhook Service is 443 -> 9443, so the pod itself only ever receives
# traffic on 9443 — kustomize's copy of this file says `port: 443`, which
# means enabling it there blocks every admission request instead of allowing
# it (a pre-existing upstream kubebuilder scaffold bug, not something this
# chart introduced). This chart uses the correct pod port; fixing
# config/network-policy/allow-webhook-traffic.yaml itself is out of this
# task's scope ("do not modify config/") and left as a follow-up.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frame.name" . }}-allow-webhook-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "frame.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            webhook: enabled
      ports:
        - port: 9443
          protocol: TCP
{{- end }}
{{- end }}
