{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "frame.name" . }}-operator-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frame.chartLabels" . | nindent 4 }}
    control-plane: controller-manager
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
  - name: frame-operator
    rules:
    # The manager is the only thing serving admission and CRD conversion, so a
    # missing leader is not only "no reconciliation": reads and writes of every
    # Hearthrack kind can fail with it (see docs/runbook.md, "The blast radius
    # when the operator is down").
    # leader_election_master_status only has a series on a pod that has held the
    # lease, and a pod that loses it exits. So "no leader" shows up as the
    # series disappearing (absent), not as a 0: the `sum == 0` arm covers the
    # short window where a pod is still reporting 0 after stepping down.
    - alert: FrameOperatorNoLeader
      expr: |
        sum(leader_election_master_status{namespace="{{ .Release.Namespace }}", name="b9bf5a0e.plume-labs.io"}) == 0
        or
        absent(leader_election_master_status{namespace="{{ .Release.Namespace }}", name="b9bf5a0e.plume-labs.io"})
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Hearthrack operator has no leader, or is not being scraped
        description: No pod reports holding the lease. Failover normally takes about 70 seconds. Otherwise the operator is down, or Prometheus cannot scrape it (check the ServiceMonitor, the NetworkPolicy and the metrics token). It also fires if the operator was scaled to 0 on purpose.
    - alert: FrameReconcileErrors
      expr: |
        sum by (controller) (rate(controller_runtime_reconcile_errors_total{namespace="{{ .Release.Namespace }}"}[10m])) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 'Hearthrack controller {{ "{{ $labels.controller }}" }} keeps failing to reconcile'
        description: Reconciles of this controller have been returning errors for 15 minutes. Look at the manager logs for that controller.
    - alert: FrameWorkqueueBacklog
      expr: |
        max by (name) (workqueue_depth{namespace="{{ .Release.Namespace }}"}) > 50
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: 'Hearthrack work queue {{ "{{ $labels.name }}" }} is backing up'
        description: More than 50 items have been waiting for 15 minutes; the controller is not keeping up or is stuck.
    - alert: FrameWebhookErrors
      expr: |
        sum(rate(controller_runtime_webhook_requests_total{namespace="{{ .Release.Namespace }}", code=~"5.."}[5m])) > 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: Hearthrack admission webhook is returning errors
        description: The webhooks fail closed, so writes of Hearthrack kinds are being refused while this fires. Conversion errors are not counted by this metric.
{{- end }}
