{{- if .Values.rbac.tierRoles.install }}
{{- $root := . }}
{{- $labels := include "frame.chartLabels" . }}
{{- $namePrefix := include "frame.name" $root }}
{{- range (fromYamlArray (include "frame.tierRoleCRDs" .)) }}
{{- /*
frameusers/status carries an argon2id password hash (F11), so only the admin
tier may touch it — the editor and viewer tiers get no /status rule at all,
and the admin tier gets write on it as well as read, because setting or
resetting a password is only reachable through the subresource now. Every
other kind's status is the controller's to write and safe to read, which is
what makes this a per-kind exception rather than a blanket rule.

Note what the exception does *not* do: a plain `GET frameusers` still returns
the whole object, status included, so the lower tiers can still read the hash
(the subresource splits writes, not reads — measured, not assumed). It blocks
the write path and the /status endpoint. See docs/deployment.md, "RBAC".

This must stay byte-for-byte equivalent to config/rbac/*_{admin,editor,
viewer}_role.yaml — there is no `make helm-sync-rbac`; `make helm-parity` is
the only thing keeping the two hand-maintained copies in step.
*/}}
{{- $lowerTiersGetStatus := true }}
{{- $adminWritesStatus := false }}
{{- if eq .roleBase "frameuser" }}
{{- $lowerTiersGetStatus = false }}
{{- $adminWritesStatus = true }}
{{- end }}
{{- /*
framemachine's controller writes discovered inventory/sensors/events to
status by polling the BMC, same as every other kind — lowerTiersGetStatus
stays true. But status also carries the power-cycle outcome the controller
records after acting on spec.powerRequest, and admin is the only tier the
console lets write the power request in the first place (see
frame.tierRoleCRDs above), so admin gets patch/update on the subresource too,
matching config/rbac/framemachine_admin_role.yaml.
*/}}
{{- if eq .roleBase "framemachine" }}
{{- $adminWritesStatus = true }}
{{- end }}
{{- /*
Which of the three roles carry the aggregation label. Defaults to all three;
`aggregate` in frame.tierRoleCRDs narrows it, and that helper is where the
reasoning per kind lives. Rendering the label for a tier this kind excludes
is how an operator got a one-PATCH promotion to admin, so this is not
cosmetic — see the whole-branch review's C4.
*/}}
{{- $aggregate := .aggregate | default (list "admin" "editor" "viewer") }}
# This rule is not used by the project frame itself. It is provided to allow
# the cluster admin to help manage permissions for users.
#
# Grants the full set of verbs over {{ .apiGroup }}/{{ .resource }}, enumerated
# explicitly. It used to be '*', which also covers verbs and subresources that
# do not exist yet — an admin tier that silently acquires whatever a future
# version adds is not a frozen tier.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-{{ .roleBase }}-admin-role
  labels:
    {{- $labels | nindent 4 }}
    {{- if has "admin" $aggregate }}
    rbac.frame.plume-labs.io/tier: admin
    {{- end }}
rules:
- apiGroups:
  - {{ .apiGroup }}
  resources:
  - {{ .resource }}
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - {{ .apiGroup }}
  resources:
  - {{ .resource }}/status
  verbs:
  - get
  {{- if $adminWritesStatus }}
  - patch
  - update
  {{- end }}
---
# Grants create/update/delete over {{ .apiGroup }}/{{ .resource }}, without
# permission to manage RBAC for others.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-{{ .roleBase }}-editor-role
  labels:
    {{- $labels | nindent 4 }}
    {{- if has "editor" $aggregate }}
    rbac.frame.plume-labs.io/tier: editor
    {{- end }}
rules:
- apiGroups:
  - {{ .apiGroup }}
  resources:
  - {{ .resource }}
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{- if $lowerTiersGetStatus }}
- apiGroups:
  - {{ .apiGroup }}
  resources:
  - {{ .resource }}/status
  verbs:
  - get
{{- end }}
---
# Grants read-only access to {{ .apiGroup }}/{{ .resource }}.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-{{ .roleBase }}-viewer-role
  labels:
    {{- $labels | nindent 4 }}
    {{- if has "viewer" $aggregate }}
    rbac.frame.plume-labs.io/tier: viewer
    {{- end }}
rules:
- apiGroups:
  - {{ .apiGroup }}
  resources:
  - {{ .resource }}
  verbs:
  - get
  - list
  - watch
{{- if $lowerTiersGetStatus }}
- apiGroups:
  - {{ .apiGroup }}
  resources:
  - {{ .resource }}/status
  verbs:
  - get
{{- end }}
---
{{- end }}
{{- end }}
{{- /*
Alert relay (2026-09-15). framealert and framealertsubscription do not fit
the generic shape above and are rendered by hand instead of through
frame.tierRoleCRDs:

  framealert — read-only on EVERY tier, including admin. A FrameAlert is not
    a human-authored object: only the alert manager's ServiceAccount writes
    one, by relaying what Alertmanager fired. There is no "admin write" for
    this kind, by design — see config/rbac/framealert_admin_role.yaml.
  framealertsubscription — admin gets the full verb set minus
    deletecollection (same reasoning as frametask: a frozen tier does not
    silently acquire a bulk verb a future version might add), viewer is
    read-only, and there is no editor role at all: the editor tier gets
    nothing beyond what it already inherits from the viewer role through
    aggregation, so an unlabelled editor role (the framemachine/frameinstall/
    frameuser pattern) would grant nothing new. See
    config/rbac/framealertsubscription_viewer_role.yaml.

This must stay byte-for-byte equivalent to config/rbac/framealert*_role.yaml
— same caveat as above: there is no `make helm-sync-rbac`, `make
helm-parity` is what keeps the two copies in step.
*/}}
{{- if .Values.rbac.tierRoles.install }}
{{- $labels := include "frame.chartLabels" . }}
{{- $namePrefix := include "frame.name" . }}
# This rule is not used by the project frame itself. It is provided to allow
# the cluster admin to help manage permissions for users.
#
# Grants read-only access to FrameAlert resources — the record of an alert
# the cluster has fired. This is what the Alerts screen reads for everyone;
# no tier, including admin, ever writes a FrameAlert.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-framealert-admin-role
  labels:
    {{- $labels | nindent 4 }}
    rbac.frame.plume-labs.io/tier: admin
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-framealert-viewer-role
  labels:
    {{- $labels | nindent 4 }}
    rbac.frame.plume-labs.io/tier: viewer
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealerts/status
  verbs:
  - get
---
# Grants the full set of verbs over frame.plume-labs.io/framealertsubscriptions,
# enumerated explicitly (no deletecollection). Deciding who receives the
# cluster's alerts is an admin call: this is the only tier that may create,
# update or delete a subscription. No editor role exists for this kind — see
# the header above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-framealertsubscription-admin-role
  labels:
    {{- $labels | nindent 4 }}
    rbac.frame.plume-labs.io/tier: admin
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealertsubscriptions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealertsubscriptions/status
  verbs:
  - get
---
# Grants read-only access to FrameAlertSubscription resources — who receives
# the cluster's alerts and where.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $namePrefix }}-framealertsubscription-viewer-role
  labels:
    {{- $labels | nindent 4 }}
    rbac.frame.plume-labs.io/tier: viewer
rules:
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealertsubscriptions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - frame.plume-labs.io
  resources:
  - framealertsubscriptions/status
  verbs:
  - get
---
{{- end }}
