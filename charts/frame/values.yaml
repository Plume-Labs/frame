# Default values for the frame chart.
# See charts/frame/README.md for the two load-bearing decisions this chart
# makes (templated CRDs, fixed resource names) before changing either.

image:
  # No default: there is no published operator image yet (publishing is out
  # of scope for this chart — see charts/frame/README.md). Leaving this
  # unset used to install cleanly and land in ImagePullBackOff with
  # example.com/frame; the Deployment template now wraps it in `required` so
  # a missing value fails at install time with an actionable message instead.
  # `make helm-lint` / `hack/helm-parity.sh` pass --set image.repository=... explicitly
  # for this reason — that isn't this chart's real default, just how the
  # render-only checks get past the guard.
  repository: ""
  # Defaults to .Chart.AppVersion when empty — see charts/frame/README.md.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Leader election is always on (cmd/main.go always gets --leader-elect); with
# replicaCount > 1 the extra pods sit hot-standby behind the Lease in
# frame-system, and this is a supported, tested configuration.
replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    # Parity fix, unrelated to lot 1: 10m left the manager with almost no CPU
    # weight under contention, which is how it kept missing its
    # leader-election renew deadline on a saturated control-plane node — see
    # config/manager/manager.yaml's requests.cpu comment, the actual decision
    # this default was meant to mirror and had drifted from since 2026-08-14.
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
# Soft (preferred, not required) anti-affinity so replicaCount: 2 actually
# buys availability instead of two pods that can both land on one node — but
# never blocks scheduling outright, so this is also safe on a single-node
# cluster (e.g. Kind) with replicaCount: 1. Built in templates/deployment.yaml
# from frame.selectorLabels (not hardcoded here — a values.yaml literal can't
# call that helper, and a second hand-copied set of labels would silently
# stop matching if the helper ever changed — see _helpers.tpl and N-4 in the
# delivery report). Set affinity below to anything non-empty to replace this
# default entirely; set podAntiAffinity.enabled: false to drop it with no
# replacement.
affinity: {}
podAntiAffinity:
  enabled: true

# Off by default deliberately: a PodDisruptionBudget with replicaCount: 1
# (the chart's own default) would block voluntary node drains/evictions
# forever, since minAvailable: 1 can never be satisfied while evicting the
# only pod. Only turn this on once replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# CRDs are rendered from templates/ (not Helm's magic crds/ directory) so
# `helm upgrade` can evolve schemas — see charts/frame/README.md. Each CRD
# still carries helm.sh/resource-policy: keep, so `helm uninstall` never
# takes a user's CRs (or the CRDs themselves) down with it.
crds:
  install: true

metrics:
  # Controls both the metrics port on the manager and the RBAC
  # (metrics-auth-role / metrics-reader) and Service that expose it.
  enabled: true
  # Serve metrics over HTTPS with authn/authz (matches config/default), on
  # :8443. Setting this to false switches the manager to plain HTTP on :8080
  # instead — the metrics Service, NetworkPolicy and ServiceMonitor all
  # derive their port/scheme from this value (see templates/_helpers.tpl's
  # frame.metricsPort/frame.metricsPortName) so they can't drift out of sync
  # with it. Only for local debugging — never in a shared cluster.
  secure: true
  serviceMonitor:
    # Off by default: kustomize's config/prometheus is commented out of
    # config/default too, so this keeps the chart's default rendering
    # identical to `kustomize build config/default` (see hack/helm-parity.sh).
    enabled: false
    interval: ""
    labels: {}

webhooks:
  enabled: true
  # Secret the manager reads its serving certificate from
  # (tls.crt / tls.key), mounted at /tmp/k8s-webhook-server/serving-certs.
  # With certManager.enabled: true, cert-manager owns and rotates this
  # Secret. With it false, you must create the Secret yourself before
  # installing — see charts/frame/README.md.
  certSecretName: webhook-server-cert
  # Only used when certManager.enabled is false: a PEM CA bundle (base64,
  # as Kubernetes expects for admission webhook clientConfig.caBundle)
  # injected into both WebhookConfigurations so the API server trusts the
  # externally-provisioned certificate above. Leave empty when certManager
  # is enabled — cert-manager's CA injector fills this in instead.
  caBundle: ""

certManager:
  # When true (default), cert-manager issues and rotates the webhook (and,
  # if metrics.enabled, metrics) serving certificates via a self-signed
  # Issuer, exactly like config/certmanager does today. When false, the
  # chart renders no Issuer/Certificate objects and expects the Secrets
  # named above to already exist — see charts/frame/README.md.
  enabled: true

provisiond:
  # frame-provisiond assembles per-machine Debian installer images and
  # serves them to a machine's BMC (2026-09-11, provisioning/Debian lot,
  # task 8). Defaults to true because config/default's kustomization wires
  # config/provisiond in unconditionally, with no toggle on that side at
  # all -- so true is what keeps this chart's default render agreeing with
  # `kustomize build config/default` (see hack/helm-parity.sh's default
  # parity/content-diff sections, which compare the two unconditionally).
  # The FrameInstall controller (2026-09-11, task 9) calls provisiond's
  # build API and hands the media listener's URL to every BMC it drives, so
  # this value now governs more than just whether the Deployment/Services
  # exist -- see media.url below, which the manager refuses to start
  # without.
  enabled: true
  image:
    # Unlike the manager's image.repository, this has a real default
    # rather than being `required`: config/provisiond/deployment.yaml
    # hardcodes "frame-provisiond:latest" outright (no kustomize `images:`
    # transform parameterizes it), so this mirrors that, not the manager's
    # "no default image is published yet" situation.
    repository: frame-provisiond
    # Also a literal default, not .Chart.AppVersion (see
    # templates/_helpers.tpl's frame.provisiondImageTag) — matches
    # config/provisiond/deployment.yaml's hardcoded tag exactly.
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    # Matches config/provisiond/deployment.yaml's hardcoded values exactly
    # — see that file's comment for the sizing rationale (one base netinst
    # download plus one in-flight remaster).
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  images:
    # emptyDir size for /var/lib/frame/images, mounted where both the
    # build API writes 700 MB images and the media listener reads them
    # back out of. Matches config/provisiond/deployment.yaml.
    storage: 8Gi
  media:
    # A fixed NodePort, not a Service-allocated one, because the BMC's boot
    # media configuration has to name a concrete address — it cannot be
    # re-read from the cluster on every reinstall. Matches
    # config/provisiond/service.yaml's hardcoded 30581. A second cluster on
    # the same management network collides with this number if left at the
    # default; override per cluster if that's a real risk in your
    # environment (there is no way for this chart to choose a value that
    # can't collide with something on a network it knows nothing about).
    nodePort: 30581
    # The base URL a machine's BMC -- on the management network, not the
    # pod network -- can reach the media listener above at, e.g.
    # "http://192.168.2.10:30581". Left empty and `required` at render
    # time, the same way image.repository is: there is no address this
    # chart could default to that is guaranteed reachable from a management
    # network it knows nothing about, and the manager itself refuses to
    # start against an unset or malformed value
    # (cmd/main.go's validateProvisiondMediaURL) rather than build images
    # whose boot arguments point nowhere.
    url: ""
  build:
    # The in-cluster build API's own address is always
    # http://{name}-provisiond:8080 (provisiond-service.yaml), and
    # frame.name (_helpers.tpl) is a fixed literal, not release-scoped -- so
    # unlike media.url this needs no value most installs will ever touch.
    # Still overridable for the rare case the manager needs to reach a
    # provisiond outside this release entirely.
    url: ""

networkPolicy:
  # Matches today's kustomize behaviour: config/network-policy exists but is
  # commented out of config/default, so it's off by default here too.
  #
  # IMPORTANT (N-1): the webhook rule intentionally does NOT restrict *who*
  # can reach port 9443, only that nothing else can. On a real cluster
  # (k3s, kubeadm, EKS with self-managed control plane, …) kube-apiserver is
  # a HOST PROCESS, not a pod — it has no namespace, so a `namespaceSelector`
  # can never match it (kustomize's own config/network-policy/
  # allow-webhook-traffic.yaml has exactly this problem, on top of the port
  # bug this chart already fixes — see templates/networkpolicy.yaml).
  # `failurePolicy: Fail` is set on all 10 admission webhooks, so a policy
  # the apiserver can't satisfy is not a source restriction, it is a
  # cluster-wide CR write outage the moment this value is turned on. Verified
  # cross-node on Kind+Calico: a `namespaceSelector`-restricted rule dropped
  # host->pod webhook traffic even with the port fixed; the open rule below
  # did not.
  #
  # The webhook server's real authentication is mTLS (cert-manager-issued,
  # or your own PKI — see certManager.enabled), so leaving 9443 open to any
  # source and relying on that is the honest default. If you want to
  # additionally restrict *where* admission calls may originate, set
  # webhookSourceCIDRs to your control-plane node IPs/CIDR — those are
  # cluster-specific and cannot be a chart default.
  enabled: false
  webhookSourceCIDRs: []

rbac:
  # The viewer/editor/admin ClusterRoles, three per CRD (framejob, framenode,
  # frameresourcequota, frameuser, schedulingpolicy, talosmachineconfig,
  # talosupgrade, frameservice — 24 in all). Not used by the manager itself —
  # they're convenience roles for cluster admins to bind to real users/groups,
  # and this chart binds none of them, so installing them grants nobody
  # anything.
  #
  # frameuser is the exception in shape as well as in origin (it is the one
  # kubebuilder never scaffolded): its editor and viewer roles carry no
  # frameusers/status rule, because status.passwordHash is an argon2id
  # credential. That stops those tiers *writing* a password hash — together
  # with the validating webhook, which is what covers the v1alpha1 spelling of
  # the same field, since RBAC has no version dimension. It does not stop them
  # reading one, since a plain `get frameusers` returns status too.
  # Bind frameuser-viewer-role only to principals you would hand the hashes.
  # See docs/deployment.md, "RBAC".
  #
  # Five of the 24 also carry no `rbac.frame.plume-labs.io/tier` label, so the
  # three aggregated `frame-*` ClusterRoles do not pick them up: frameuser's
  # viewer and editor, and talosmachineconfig's and talosupgrade's editors.
  # `get frameusers` is every password hash and `patch frameusers` is a
  # one-request promotion to admin; Talos writes rewrite a machine config or
  # reboot a node into a new image. See `aggregate` in frame.tierRoleCRDs
  # (templates/_helpers.tpl) for the per-kind reasoning, and
  # `make helm-parity`, which compares that label against config/rbac/.
  tierRoles:
    install: true
